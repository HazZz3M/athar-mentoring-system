name: Test & deploy to Apps Script

on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", ".clasp.json", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: apps-script-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests (no deploy if any test fails)
        run: npm test

      - name: Install clasp
        run: npm install -g @google/clasp@2.4.2

      - name: Write clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then echo "::error::Secret CLASPRC_JSON is missing (see README)"; exit 1; fi
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json

      - name: Push code to the Apps Script project bound to the sheet
        run: clasp push --force

      - name: Update the live web app (same URL for mentors)
        env:
          DEPLOYMENT_ID: ${{ vars.DEPLOYMENT_ID }}
        run: |
          if [ -z "$DEPLOYMENT_ID" ]; then echo "::warning::DEPLOYMENT_ID variable not set; code pushed but web app version not updated"; exit 0; fi
          clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "GitHub ${GITHUB_SHA::7}"
