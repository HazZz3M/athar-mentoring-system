<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أثر — نظام المنتورينج</title>
<style>
:root{--pri:#145a63;--pri2:#1d7480;--pri-l:#e7f1f2;--acc:#c7902b;--acc-l:#fbf3e3;--ok:#2f8a55;--ok-l:#e6f4ec;--warn:#b7791f;--warn-l:#fdf3e1;--bad:#b4413a;--bad-l:#fbe9e7;
--ink:#1c2a2f;--mut:#617076;--line:#d9e4e6;--bg:#f5f8f8;--card:#fff;--r:10px}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:"Noto Naskh Arabic","Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri2)}
.top{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 14px;flex-wrap:wrap}
.top .brand{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px}.logo{width:30px;height:30px;border-radius:8px;background:#fff;color:var(--pri);display:grid;place-items:center;font-weight:800}
.top .sp{flex:1}.top select{width:auto;max-width:220px;background:#ffffff1f;border:1px solid #ffffff55;color:#fff;border-radius:8px;padding:4px 8px}.top select option{color:#000}
.navb{background:transparent;border:1px solid #ffffff55;color:#fff;border-radius:8px;padding:5px 12px;cursor:pointer}.navb.on{background:#fff;color:var(--pri);font-weight:700}
.wrap{max-width:1180px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.card.flat{box-shadow:none}.card h3{margin:0 0 8px;font-size:16px}
h2{font-size:19px;margin:6px 0 10px;color:var(--pri)}h4{margin:8px 0 6px;font-size:14.5px;color:var(--pri)}
.btn{border:1px solid var(--pri);background:var(--pri);color:#fff;border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:600}
.btn.sec{background:#fff;color:var(--pri)}.btn.ghost{background:transparent;border-color:transparent;color:var(--pri2);padding:4px 8px}
.btn.warn{background:var(--acc);border-color:var(--acc)}.btn.danger{background:#fff;color:var(--bad);border-color:var(--bad)}.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grow{flex:1}
.grid{display:grid;gap:10px}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
label.f{display:block;font-size:13px;color:var(--mut);margin:6px 0 2px}
input[type=text],input[type=date],input[type=number],input[type=url],select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff}
textarea{min-height:64px;resize:vertical}input:focus,select:focus,textarea:focus{outline:2px solid #1d748055;border-color:var(--pri2)}
.mut{color:var(--mut)}.sm{font-size:12.5px}.b{font-weight:700}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 11px;margin:3px;cursor:pointer;font-size:13px;user-select:none}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}.chip.ok.on{background:var(--ok);border-color:var(--ok)}.chip.bad.on{background:var(--bad);border-color:var(--bad)}.chip.warn.on{background:var(--warn);border-color:var(--warn)}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:1px 9px;background:var(--pri-l);color:var(--pri);margin:1px 2px;white-space:nowrap}
.tag.ok{background:var(--ok-l);color:var(--ok)}.tag.warn{background:var(--warn-l);color:var(--warn)}.tag.bad{background:var(--bad-l);color:var(--bad)}.tag.acc{background:var(--acc-l);color:#8a6418}.tag.gray{background:#eef1f2;color:#5a666b}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.tile{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px}.tile .n{font-size:22px;font-weight:800;color:var(--pri)}.tile .l{font-size:12.5px;color:var(--mut)}
.tile.ok .n{color:var(--ok)}.tile.bad .n{color:var(--bad)}.tile.warn .n{color:var(--warn)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff}table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 7px;text-align:right;vertical-align:top}
table.t th{background:#f0f5f6;font-weight:700;color:#33474d;position:sticky;top:0}table.t tr.click{cursor:pointer}table.t tr.click:hover{background:#f7fbfb}
.tbl{overflow:auto;max-width:100%;border:1px solid var(--line);border-radius:8px}
.stepper{display:flex;gap:4px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:thin}
.stp{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.stp.on{background:var(--pri);color:#fff;border-color:var(--pri)}.stp.done{border-color:var(--ok);color:var(--ok)}.stp.lock{opacity:.5}
.foot{position:sticky;bottom:0;background:#fffffff2;border-top:1px solid var(--line);padding:8px 14px;display:flex;gap:8px;align-items:center;z-index:15;backdrop-filter:blur(3px)}
.acc{border:1px solid var(--line);border-radius:var(--r);background:#fff;margin:8px 0;overflow:hidden}
.acc>.hd{padding:10px 12px;display:flex;gap:8px;align-items:center;cursor:pointer;flex-wrap:wrap}.acc>.hd:hover{background:#f7fbfb}.acc>.bd{padding:10px 12px;border-top:1px solid var(--line)}
.acc.open>.hd{background:var(--pri-l)}.caret{transition:transform .15s;display:inline-block}.acc.open .caret{transform:rotate(-90deg)}
.box{border-radius:8px;padding:8px 10px;margin:6px 0}.box.info{background:var(--pri-l)}.box.warn{background:var(--warn-l);color:#7a5413}.box.bad{background:var(--bad-l);color:#8b2f29}.box.ok{background:var(--ok-l);color:#1f6a40}
.eg{background:#f4faf5;border-right:4px solid var(--ok);padding:6px 10px;border-radius:4px;margin:6px 0}
.steps{margin:6px 0;padding-inline-start:20px}.steps li{margin:3px 0}
.sel{outline:2px solid var(--pri);background:var(--pri-l)!important}
.opt{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:#fff;cursor:pointer}.opt:hover{border-color:var(--pri2)}
.dots{display:flex;gap:3px;flex-wrap:wrap}.dot{width:12px;height:12px;border-radius:3px;background:#dfe6e8}.dot.d{background:var(--ok)}.dot.p{background:var(--warn)}.dot.m{background:var(--bad)}.dot.n{background:#f1f3f4;border:1px dashed #c3ccce}
.slot{border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12px;cursor:pointer;background:#fff;min-width:74px;text-align:center}
.slot.d{background:var(--ok-l);border-color:var(--ok);color:var(--ok)}.slot.p{background:var(--warn-l);border-color:var(--warn);color:var(--warn)}.slot.m{background:var(--bad-l);border-color:var(--bad);color:var(--bad)}.slot.n{background:#f4f6f6;color:#8a9599;border-style:dashed}
.bar{height:9px;background:#e7eeef;border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--pri2)}
.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;z-index:50;padding:10px}.modal>.card{width:min(720px,100%);max-height:92vh;overflow:auto}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#1c2a2f;color:#fff;padding:8px 16px;border-radius:8px;z-index:60;max-width:90vw}
.load{position:fixed;inset:0;background:#ffffffb0;display:grid;place-items:center;z-index:70;font-weight:700;color:var(--pri)}
.testflag{background:#fff3cd;color:#7a5b00;border:1px dashed #c9a227;border-radius:6px;padding:1px 8px;font-size:12px}
.pcard{cursor:pointer;transition:border-color .1s}.pcard:hover{border-color:var(--pri2)}
.kv{font-size:13.5px;margin:2px 0}.kv b{color:var(--pri)}
.hist{font-size:12.5px;background:#fafcfc;border:1px dashed var(--line);border-radius:8px;padding:6px 8px;margin:6px 0}
.req::after{content:" *";color:var(--bad)}
iframe.plan{width:100%;height:72vh;border:1px solid var(--line);border-radius:var(--r);background:#fff}
@media (max-width:640px){.wrap{padding:8px}.card{padding:10px}.top .brand span.t{display:none}.foot{flex-wrap:wrap}}
@media print{.top,.foot,.noprint{display:none!important}}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><div class="logo">أثر</div><span class="t">نظام المنتورينج ومتابعة الأداء</span></div>
  <button class="navb" data-act="nav" data-v="projects" id="nav-projects">المشروعات</button>
  <button class="navb" data-act="nav" data-v="dashboard" id="nav-dashboard">لوحة المؤشرات</button>
  <div class="sp"></div>
  <label class="sm">المنتور:</label><select id="mentorSel" data-act="mentor"></select>
  <label class="sm"><input type="checkbox" id="testChk" data-act="toggleTest"> عرض البيانات التجريبية</label>
</div>
<div id="app" class="wrap"><div class="card">جارٍ التحميل…</div></div>
<div id="foot"></div>
<div id="overlay"></div>
<script>
/* ============================================================ backend bridge */
function call(fn){ var args=[].slice.call(arguments,1);
  return new Promise(function(res,rej){
    var done=function(txt){ var r=typeof txt==='string'?JSON.parse(txt):txt; if(r.ok) res(r.data); else { var e=new Error(r.error); e.details=r.details; rej(e);} };
    if(window.google&&google.script&&google.script.run){ google.script.run.withSuccessHandler(done).withFailureHandler(function(e){rej(e)}).api(fn, JSON.stringify(args)); }
    else if(window.LocalAPI){ setTimeout(function(){ try{ done(window.LocalAPI(fn,args)); }catch(e){ rej(e);} },60); }
    else if(window.ATHAR_API){ // GitHub Pages: plain POST (text/plain = no CORS preflight) to the Apps Script web app
      fetch(window.ATHAR_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args,user:mentorLabel()})})
        .then(function(r){return r.text()}).then(function(t){try{done(t)}catch(e){rej(new Error('رد غير متوقع من الخادم'))}},function(){rej(new Error('تعذر الاتصال بالخادم — تأكد من الإنترنت وحاول تاني'))}); }
    else rej(new Error('لا يوجد اتصال بالخادم'));
  });
}
/* ============================================================ state & utils */
var S={boot:null,L:null,view:'projects',mentorId:'',includeTest:false,projects:[],q:'',journey:null,jf:{session:'',area:'',status:'',type:'',q:''},jtab:'journey',
  ctx:null,d:null,step:1,dirty:false,openCards:{},plan:null,dash:null,df:{},busy:0,lastSaved:''};
var STEPS=['بيانات الجلسة','مراجعة المهام السابقة','مراجعة الأداء','تشخيص المشكلة','اختيار الاستراتيجية','المهام الجديدة','الروتينات','حجم العمل','المراجعة النهائية','الحفظ والخطة'];
function esc(t){return (t===null||t===undefined?'':String(t)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function ids(s){return String(s||'').split(/[,،]/).map(function(x){return x.trim()}).filter(Boolean);}
function idx(a,k){var m={};(a||[]).forEach(function(r){m[r[k]]=r});return m;}
function grp(a,k){var m={};(a||[]).forEach(function(r){(m[r[k]]=m[r[k]]||[]).push(r)});return m;}
function addDays(s,n){var p=s.split('-');var d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]+n));return d.toISOString().slice(0,10);}
function num(v){if(v===''||v===null||v===undefined)return null;var n=Number(String(v).replace(/,/g,''));return isNaN(n)?null:n;}
function fmtN(v){return v===null||v===undefined||v===''?'—':Number(v).toLocaleString('en-US');}
function pct(v){return v===null||v===undefined?'—':(v+'%');}
function toast(m,ms){var o=document.createElement('div');o.className='toast';o.textContent=m;document.body.appendChild(o);setTimeout(function(){o.remove()},ms||2600);}
function busy(on,msg){S.busy+=on?1:-1;document.getElementById('overlay').innerHTML=S.busy>0?'<div class="load">'+esc(msg||'جارٍ التنفيذ…')+'</div>':'';}
function run(p,msg){busy(true,msg);return p.then(function(x){busy(false);return x},function(e){busy(false);showErr(e);throw e;});}
function showErr(e){var d=e&&e.details;modal('<h3 style="color:var(--bad)">تعذر التنفيذ</h3>'+(d&&d.length?'<ul>'+d.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>':'<div style="white-space:pre-wrap">'+esc(e&&e.message||e)+'</div>')+'<div class="row" style="justify-content:flex-end"><button class="btn" data-act="closeModal">حسنًا</button></div>');}
function modal(html){document.getElementById('overlay').innerHTML='<div class="modal" data-act="modalBg"><div class="card">'+html+'</div></div>';}
function closeModal(){document.getElementById('overlay').innerHTML='';}
function getP(o,path){return path.split('|').reduce(function(a,k){return a==null?undefined:a[k]},o);}
function setP(o,path,v){var ks=path.split('|');var last=ks.pop();var t=ks.reduce(function(a,k){if(a[k]==null||typeof a[k]!=='object')a[k]={};return a[k]},o);t[last]=v;}
function area(id){return (S.L.area[id]||{}).AreaName||id||'';}
function statusTag(s){var c={'مكتملة':'ok','مكتملة جزئيًا':'warn','قيد التنفيذ':'','لم تبدأ':'bad','متعثرة':'bad','جديدة':'gray'}[s];return s?'<span class="tag '+(c===undefined?'gray':c)+'">'+esc(s)+'</span>':'';}
function decTag(s){if(!s)return '';var c={'تم الإنجاز':'ok','إلغاء لعدم الملاءمة':'gray','إيقاف مؤقت':'gray','ترحيل بموعد جديد':'warn','تقسيم لمهام أصغر':'acc','تعديل/تبسيط':'acc','تصعيد/دعم إضافي':'bad'}[s];return '<span class="tag '+(c||'')+'">'+esc(s)+'</span>';}
function spark(vals){vals=(vals||[]).map(Number).filter(function(v){return !isNaN(v)});if(vals.length<2)return '';var w=90,h=24,mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),r=mx-mn||1;
  var pts=vals.map(function(v,i){return (i*(w/(vals.length-1))).toFixed(1)+','+(h-2-(v-mn)/r*(h-4)).toFixed(1)}).join(' ');
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" style="vertical-align:middle;direction:ltr"><polyline fill="none" stroke="#1d7480" stroke-width="2" points="'+pts+'"/></svg>';}

/* ============================================================ boot */
function indexLib(lib){var L={};Object.keys(lib).forEach(function(k){L[k]=lib[k]});
  L.area=idx(lib.LIB_Areas,'AreaID');L.problem=idx(lib.LIB_Problems,'ProblemID');L.cause=idx(lib.LIB_Causes,'CauseID');L.strategy=idx(lib.LIB_Strategies,'StrategyID');
  L.action=idx(lib.LIB_Actions,'TaskID');L.routine=idx(lib.LIB_Routines,'RoutineID');L.kpi=idx(lib.LIB_KPIs,'KPIID');L.steps=grp(lib.LIB_ActionSteps,'TaskID');L.rsteps=grp(lib.LIB_RoutineSteps,'RoutineID');
  L.lists={};(lib.LIB_Lists||[]).forEach(function(r){(L.lists[r.ListName]=L.lists[r.ListName]||[]).push(r.Value)});
  L.roadmapList=(lib.LIB_RoadmapTasks||[]).filter(function(r){return r.RoadmapID&&r.Active!=='لا'});L.roadmap=idx(L.roadmapList,'RoadmapID');
  L.checklist=(lib.LIB_RoadmapChecklist||[]).filter(function(r){return r.ItemID}).sort(function(a,b){return (+a.SortOrder||0)-(+b.SortOrder||0)});L.checkItem=idx(L.checklist,'ItemID');
  L.roadmapList.forEach(function(t){if(!L.routine[t.RoadmapID])L.routine[t.RoadmapID]={RoutineID:t.RoadmapID,AreaID:t.AreaID,RoutineName:t.TaskText,Purpose:t.ExpectedResult,RoutineType:'مهمة خريطة الطريق',
    FrequencyCode:t.FrequencyCode,FrequencyText:t.FrequencyText,Responsible:'صاحب المشروع',SummaryEg:t.ExpectedResult,Evidence:t.Indicator,Code:t.Code,Domain:t.Domain,ProgramDay:t.ProgramDay,AppliesTo:t.AppliesTo,IsRoadmap:true}});
  return L;}
/* ---- Assiut roadmap helpers (same rules as Core.gs) */
function normAr(s){return String(s||'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim();}
function isRoadmapP(p){var g=normAr(p&&p.Governorate);return !!g&&((S.boot.constants.roadmapGovs)||[]).some(function(x){return normAr(x)===g});}
function appliesMode(a,mode){a=String(a||'');if(!a||a==='كل المشاريع'||!mode||mode==='الاتنين')return true;if(a.indexOf('بينتج')>=0)return mode==='بينتج';if(a.indexOf('بيشتري')>=0)return mode==='بيشتري ويبيع';return true;}
var CL_SCORE={'بيعملها':2,'ساعات':1,'لأ':0};
function clScore(vals){var sc=vals.filter(function(v){return CL_SCORE[v]!==undefined});var sum=sc.reduce(function(a,v){return a+CL_SCORE[v]},0);return {pct:sc.length?Math.round(sum/(2*sc.length)*1000)/10:null,n:sc.length};}
function clTag(v){var c={'بيعملها':'ok','ساعات':'warn','لأ':'bad','مش بيخصه':'gray'}[v]||'gray';return v?'<span class="tag '+c+'">'+esc(v)+'</span>':'';}
function lsGet(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function mentorLabel(){var m=S.boot&&S.mentorId?S.boot.mentors.filter(function(x){return x.MentorID===S.mentorId})[0]:null;return m?m.MentorName+' ('+m.MentorID+')':'';}
/** GitHub Pages app: no sign-in — the mentor picks their name once per device. */
function pickMentorModal(){var ms=S.boot.mentors.filter(function(m){return m.DataType!=='تجريبي'||S.includeTest});
  modal('<h3>أهلًا! اختار اسمك</h3><div class="sm mut">هيتحفظ على الجهاز ده، وتقدر تغيّره من القائمة فوق.</div><div style="display:grid;gap:6px;margin-top:10px">'+(ms.length?ms:S.boot.mentors).map(function(m){return '<button class="btn sec" data-act="pickMentor" data-v="'+esc(m.MentorID)+'">'+esc(m.MentorName)+'</button>'}).join('')+'</div>');}
/** The library (~350 KB) is kept in the browser and re-downloaded only when its version changes. */
function bootLib(){var v=lsGet('athar_libv'),cached=null;if(v){try{cached=JSON.parse(lsGet('athar_lib')||'null')}catch(e){cached=null}}
  return call('bootstrap',cached?{libVersion:v}:{}).then(function(b){if(b.library){if(b.libVersion){lsSet('athar_lib',JSON.stringify(b.library));lsSet('athar_libv',b.libVersion);}return b;}
    if(cached){b.library=cached;return b;}return call('bootstrap',{});});}
function init(){
  run(bootLib(),'تحميل المكتبة…').then(function(b){S.boot=b;S.L=indexLib(b.library);
    var sel=document.getElementById('mentorSel');sel.innerHTML='<option value="">كل المنتورين</option>'+b.mentors.map(function(m){return '<option value="'+esc(m.MentorID)+'">'+esc(m.MentorName)+(m.DataType==='تجريبي'?' (تجريبي)':'')+'</option>'}).join('');
    var me=b.mentors.filter(function(m){return m.Email&&m.Email===b.user})[0];
    if(!me&&window.ATHAR_API){var saved=lsGet('athar_mentor');me=b.mentors.filter(function(m){return m.MentorID===saved})[0];}
    if(me){S.mentorId=me.MentorID;sel.value=me.MentorID;}
    if(window.DEMO_MODE){S.includeTest=true;document.getElementById('testChk').checked=true;}
    S.needPick=!!(window.ATHAR_API&&!me);go('projects');});
}
function go(v){if(S.view==='session'&&v!=='session'&&S.dirty){saveDraft(true);}S.view=v;['projects','dashboard'].forEach(function(n){document.getElementById('nav-'+n).classList.toggle('on',n===v||(n==='projects'&&(v==='journey'||v==='session'||v==='plan')))});
  if(v==='projects')loadProjects();else if(v==='dashboard')loadDash();else render();window.scrollTo(0,0);}
function render(){var a=document.getElementById('app'),f=document.getElementById('foot');f.innerHTML='';
  if(S.view==='projects')a.innerHTML=vProjects();else if(S.view==='journey')a.innerHTML=vJourney();else if(S.view==='session'){a.innerHTML=vSession();f.innerHTML=vFoot();}
  else if(S.view==='plan')a.innerHTML=vPlan();else if(S.view==='dashboard')a.innerHTML=vDash();
  if(S.view==='plan'&&S.plan){var fr=document.getElementById('planFrame');if(fr)fr.srcdoc=S.plan.mode==='a4'&&S.plan.a4?S.plan.a4:S.plan.html;}}

/* ============================================================ projects */
function loadProjects(){run(call('listProjects',{includeTest:S.includeTest}),'تحميل المشروعات…').then(function(p){S.projects=p;render();if(S.needPick){S.needPick=false;pickMentorModal();}});}
function vProjects(){var q=S.q.trim();var list=S.projects.filter(function(p){return (!S.mentorId||p.MentorID===S.mentorId)&&(!q||(p.ProjectName+' '+p.OwnerName+' '+p.BusinessType+' '+p.Governorate+' '+p.ProjectID).indexOf(q)>=0)});
  var h='<div class="row"><h2 class="grow">المشروعات ('+list.length+')</h2><button class="btn" data-act="newProject">+ مشروع جديد</button></div>';

function vRoutinesTab(){var rs=S.journey.routines;if(!rs.length)return '<div class="card mut">لا توجد روتينات مسندة.</div>';

    return '<tr><td>'+(r.Code?'<span class="tag">'+esc(r.Code)+'</span> ':'')+'<b>'+esc(r.RoutineName)+'</b>'+(r.stable?' <span class="tag ok">ثابت ✓</span>':'')+'<div class="sm mut">'+esc(r.Purpose)+(r.WhenWhere?' — إمتى وفين: '+esc(r.WhenWhere):'')+'</div></td><td><span class="tag acc">'+esc(r.RoutineType)+'</span>'+(r.StrategyName?'<div class="sm">'+esc(r.StrategyName)+'</div>':'')+'</td><td>'+esc(r.FrequencyText)+'</td><td>'+esc(r.StartDate)+'</td><td><span class="tag '+(r.Status==='نشط'?'ok':'gray')+'">'+esc(r.Status)+'</span></td><td>'+r.done+'/'+r.planned+' <b>'+pct(r.rate)+'</b><div class="bar"><i style="width:'+(r.rate||0)+'%"></i></div></td><td><div class="dots">'+r.occurrences.slice(-30).map(occDot).join('')+'</div></td><td class="sm">'+esc(r.CustomNote)+'</td></tr>'}).join('')+'</table></div><div class="sm mut">● أخضر = تم، برتقالي = جزئي، أحمر = لم يتم، منقط = غير مستحق/إجازة. كل مرة مستحقة لها سجل تنفيذ منفصل.</div>';}
function vKpiTab(){var ks=S.journey.kpis;if(!ks.length)return '<div class="card mut">لم تُسجل مؤشرات بعد. تُضاف المؤشرات في خطوة «مراجعة الأداء» داخل الجلسة.</div>';
  var sesNos=[];ks.forEach(function(k){k.values.forEach(function(v){if(sesNos.indexOf(v.SessionNo)<0)sesNos.push(v.SessionNo)})});sesNos.sort(function(a,b){return a-b});
  return '<div class="tbl"><table class="t"><tr><th>المؤشر</th>'+sesNos.map(function(n){return '<th>جلسة '+n+'</th>'}).join('')+'<th>الاتجاه</th><th>التغير من أول قياس</th><th>المستهدف</th></tr>'+ks.map(function(k){var bv=idx(k.values,'SessionNo');
    var good=k.change===null||k.change===0?'':(k.Direction==='أعلى أفضل'?(k.change>0?'ok':'bad'):k.Direction==='أقل أفضل'?(k.change<0?'ok':'bad'):'');
    return '<tr><td><b>'+esc(k.KPIName)+'</b><div class="sm mut">'+esc(k.Unit)+' — '+esc(k.Direction)+'</div></td>'+sesNos.map(function(n){return '<td>'+(bv[n]?fmtN(bv[n].Value):'—')+'</td>'}).join('')+'<td>'+spark(k.values.map(function(v){return v.Value}))+'</td><td><span class="tag '+good+'">'+(k.change===null?'—':(k.change>0?'+':'')+fmtN(k.change)+(k.changePct!==null?' ('+k.changePct+'%)':''))+'</span></td><td>'+fmtN(k.TargetValue)+'</td></tr>'}).join('')+'</table></div>'+
    '<div class="box info sm">تغير المؤشر لا يعني تلقائيًا أن المهام هي السبب؛ راجع ملاحظة «النتيجة الفعلية للأعمال» في كل جلسة.</div>';}

/* ============================================================ session */
function startSession(){var j=S.journey;var draft=j.sessions.filter(function(s){return s.Status==='مسودة'})[0];
  var p=draft?call('getDraft',draft.SessionID):call('startSession',j.project.ProjectID,S.mentorId||j.project.MentorID,S.boot.today);
  run(p,'تحضير الجلسة واسترجاع المهام السابقة…').then(function(ctx){S.ctx=ctx;S.d=upgradeDraft(ctx.draft||newDraft(ctx),ctx);S.step=S.d.step||1;S.view='session';S.dirty=false;S.openCards={};
    if(ctx.openAssignments.length)S.openCards['rv_'+ctx.openAssignments[0].AssignmentID]=1;render();window.scrollTo(0,0);});}
function newDraft(ctx){var prev=ctx.previousSession;var d={step:1,sessionDate:ctx.session.SessionDate,planEnd:addDays(ctx.session.SessionDate,7),reviews:{},routineReviews:{},kpiValues:{},newProjectKPIs:{},
  diagnosis:{AreaID:'',ProblemID:'',ContinuedFocus:false,causes:{}},strategy:{PrimaryStrategyID:'',SupportingStrategyID:'',SupportJustification:''},newTasks:[],newRoutines:[],readiness:'',workloadNote:'',mentorSummary:'',businessResultNote:''};
  ctx.openAssignments.forEach(function(a){d.reviews[a.AssignmentID]={Status:'',ImplementationNote:'',Metrics:{},ExpectedResult:a.ExpectedResult||'',ActualResult:'',BeforeValue:'',AfterValue:'',MentorObservation:'',EvidenceType:'',EvidenceLink:'',EvidenceNote:'',Barriers:[],BarrierNote:'',Decision:'',NewDeadline:'',Adjustment:'',SubTasks:[]}});
  ctx.routines.forEach(function(r){var occ={};r.slots.forEach(function(s){occ[s.DueDate+'#'+s.PeriodLabel]=s.defaultStatus||''});d.routineReviews[r.RAID]={occ:occ,Note:'',EvidenceLink:'',Decision:r.Status==='نشط'?'':'استمرار',NewNote:'',Responsible:''}});
  if(prev&&prev.FocusProblemID){d.diagnosis.AreaID=prev.FocusAreaID;}
  return d;}
function upgradeDraft(d,ctx){d.checklist=d.checklist||{};if(d.projectMode===undefined)d.projectMode=ctx.project.ProjectMode||'';if(d.afterTrainingDay===undefined)d.afterTrainingDay='';
  (d.newRoutines||[]).forEach(function(r){if(r.WhenWhere===undefined)r.WhenWhere=''});
  ctx.routines.forEach(function(r){var rr=d.routineReviews[r.RAID];if(rr&&rr.EvidenceSeen===undefined)rr.EvidenceSeen=''});
  if(ctx.isRoadmap)applyModeNA(d,ctx);return d;}
/** Items that do not apply to the project type are «مش بيخصه» automatically; changing the type clears those auto-marks. */
function applyModeNA(d,ctx){(ctx.checklistItems||[]).forEach(function(it){var c=d.checklist[it.ItemID]=d.checklist[it.ItemID]||{Value:'',Note:''};
  if(!appliesMode(it.AppliesTo,d.projectMode)){if(!c.Value||c.auto){c.Value='مش بيخصه';c.auto=1;}}else if(c.auto){c.Value='';delete c.auto;}});}
function saveDraft(silent){if(!S.ctx)return;S.d.step=S.step;var sid=S.ctx.session.SessionID;var p=call('saveDraft',sid,JSON.stringify(S.d)).then(function(r){S.dirty=false;S.lastSaved=r.savedAt;var el=document.getElementById('saveState');if(el)el.textContent='حُفظت المسودة '+r.savedAt.slice(11);if(!silent)toast('تم حفظ المسودة');});
  if(!silent)run(p,'حفظ المسودة…');}
setInterval(function(){if(S.view==='session'&&S.dirty)saveDraft(true);},45000);
function vFoot(){return '<div class="foot"><button class="btn sec" data-act="prevStep" '+(S.step===1?'disabled':'')+'>السابق</button><button class="btn" data-act="nextStep" '+(S.step===10?'disabled':'')+'>التالي ←</button>'+
  '<span class="grow sm mut" id="saveState">'+(S.lastSaved?'حُفظت المسودة '+esc(S.lastSaved.slice(11)):'المسودة تُحفظ تلقائيًا')+'</span><button class="btn sm sec" data-act="saveDraft">حفظ المسودة</button><button class="btn sm ghost" data-act="exitSession">خروج</button></div>';}
function reviewProgress(){var c=S.ctx,d=S.d;var n=c.openAssignments.filter(function(a){var r=d.reviews[a.AssignmentID];return r.Status&&r.Decision}).length;
  var rn=c.routines.filter(function(r){var rr=d.routineReviews[r.RAID];return rr.Decision&&Object.keys(rr.occ).every(function(k){return rr.occ[k]})&&(!r.IsRoadmap||!r.slots.length||rr.EvidenceSeen)}).length;return {done:n,total:c.openAssignments.length,rdone:rn,rtotal:c.routines.length};}
function stepAllowed(n){if(n<=2)return true;var p=reviewProgress();return p.done===p.total&&p.rdone===p.rtotal;}
function vSession(){var c=S.ctx,p=c.project;var h='<div class="row"><button class="btn ghost" data-act="backToJourney">→ رحلة المشروع</button><h2 class="grow" style="margin:0">'+esc(p.ProjectName)+' — جلسة '+c.session.SessionNo+' '+(p.DataType==='تجريبي'?'<span class="testflag">تجريبي</span>':'')+'</h2></div>';
  h+='<div class="stepper">'+STEPS.map(function(s,i){var n=i+1;return '<span class="stp '+(n===S.step?'on':'')+(n<S.step?' done':'')+(!stepAllowed(n)?' lock':'')+'" data-act="goStep" data-v="'+n+'">'+n+'. '+s+'</span>'}).join('')+'</div>';
  h+=[null,st1,st2,st3,st4,st5,st6,st7,st8,st9,st10][S.step]();return h;}
function inp(path,type,ph,extra){var v=getP(S.d,path);return '<input type="'+(type||'text')+'" data-bind="'+path+'" value="'+esc(v)+'" placeholder="'+esc(ph||'')+'" '+(extra||'')+'>';}
function ta(path,ph,extra){return '<textarea data-bind="'+path+'" placeholder="'+esc(ph||'')+'" '+(extra||'')+'>'+esc(getP(S.d,path))+'</textarea>';}
function chips(path,opts,cls,multi){var v=getP(S.d,path);return opts.map(function(o){var on=multi?(v||[]).indexOf(o)>=0:v===o;return '<span class="chip '+(cls?cls(o):'')+(on?' on':'')+'" data-act="'+(multi?'mchip':'chip')+'" data-path="'+path+'" data-v="'+esc(o)+'">'+esc(o)+'</span>'}).join('');}

/* ---- step 1 */
function trainingDays(){var o=[];S.L.roadmapList.forEach(function(t){var d=String(t.ProgramDay||'');if(/^[٠-٩0-9]+ [^و]/.test(d)&&o.indexOf(d)<0)o.push(d)});return o.sort();}
function st1(){var c=S.ctx,p=c.project,prev=c.previousSession;var h='<div class="card"><h3>1. بيانات الجلسة</h3><div class="grid g3">'+
  '<div><label class="f">رقم الجلسة</label><input type="text" value="'+c.session.SessionNo+'" disabled></div>'+
  '<div><label class="f req">تاريخ الجلسة</label>'+inp('sessionDate','date')+'</div>'+
  '<div><label class="f req">موعد الجلسة القادمة (نهاية الخطة)</label>'+inp('planEnd','date')+'</div>'+
  '<div><label class="f">فترة المراجعة</label><input type="text" value="من '+esc(c.session.ReviewFrom)+' حتى اليوم السابق للجلسة" disabled></div>'+
  '<div><label class="f">المنتور</label><input type="text" value="'+esc((S.boot.mentors.filter(function(m){return m.MentorID===c.session.MentorID})[0]||{}).MentorName||c.session.MentorID)+'" disabled></div>'+
  '<div><label class="f">صاحب المشروع</label><input type="text" value="'+esc(p.OwnerName)+'" disabled></div>'+
  (c.isRoadmap?'<div><label class="f">بعد يوم التدريب (خريطة الطريق)</label><select data-bind="afterTrainingDay"><option value=""></option>'+trainingDays().map(function(x){return '<option'+(S.d.afterTrainingDay===x?' selected':'')+'>'+esc(x)+'</option>'}).join('')+'</select></div>':'')+'</div></div>';
  if(c.isRoadmap)h+='<div class="box info sm"><b>مشروع أسيوط — خريطة الطريق:</b> هتقيّم «تشيك ليست الروتينات» في خطوة 3، وتقدر تختار من مكتبة الـ145 مهمة في خطوة 7. '+(c.isFirstSession?'الجلسة الأولى = جلسة التشخيص: قول لصاحب المشروع «احكيلي يومك من الصبح» واطلب تشوف الكروت أو الدفتر والموبايل وصور مكان الشغل.':'الجلسة بتمشي على: الالتزام اللي فات، إيه اللي حصل، روتين جديد، تظبيط الروتين، والالتزام.')+'</div>';
  if(prev){h+='<div class="card"><h3>ملخص الجلسة السابقة (رقم '+prev.SessionNo+' — '+esc(prev.SessionDate)+')</h3><div class="kv"><b>المشكلة:</b> '+esc(prev.ProblemName)+'</div><div class="kv"><b>الاستراتيجية:</b> '+esc(prev.StrategyName)+(prev.SupportingStrategyName?' + '+esc(prev.SupportingStrategyName):'')+'</div>'+
    '<div class="kv"><b>عدد المهام الجديدة:</b> '+prev.NewTasksCount+' | <b>المستمرة:</b> '+prev.ContinuingTasksCount+' | <b>الروتينات:</b> '+prev.ActiveRoutinesCount+' | <b>الاستعداد:</b> '+prev.Readiness+'/5</div>'+
    (prev.MentorSummary?'<div class="kv"><b>ملاحظة المنتور:</b> '+esc(prev.MentorSummary)+'</div>':'')+(prev.BusinessResultNote?'<div class="kv"><b>النتيجة المسجلة:</b> '+esc(prev.BusinessResultNote)+'</div>':'')+'</div>';}
  else h+='<div class="box info">هذه أول جلسة للمشروع: لا توجد مهام سابقة للمراجعة. ستبدأ مباشرة بمراجعة الأداء (خط الأساس) ثم التشخيص.</div>';
  h+='<div class="box '+(c.openAssignments.length?'warn':'ok')+'">سيتم استرجاع <b>'+c.openAssignments.length+'</b> مهمة مفتوحة من الجلسات السابقة و<b>'+c.routines.length+'</b> روتين مستمر للمراجعة في الخطوة التالية. لا تنتقل أي مهمة للأسبوع الجديد إلا بقرار منك.</div>';
  return h;}

/* ---- step 2: review */
function st2(){var c=S.ctx,d=S.d,pr=reviewProgress();var h='';
  if(c.isFirstSession&&!c.openAssignments.length&&!c.routines.length)return '<div class="card"><h3>2. مراجعة المهام السابقة</h3><div class="box ok">أول جلسة — لا توجد مهام أو روتينات سابقة. انتقل للخطوة التالية.</div></div>';
  h+='<div class="card"><div class="row"><h3 class="grow" style="margin:0">2. مراجعة ما تم في الأسابيع السابقة (إلزامي)</h3><span class="tag '+(pr.done===pr.total?'ok':'warn')+'">المهام: '+pr.done+'/'+pr.total+'</span><span class="tag '+(pr.rdone===pr.rtotal?'ok':'warn')+'">الروتينات: '+pr.rdone+'/'+pr.rtotal+'</span></div>'+
    '<div class="sm mut">لكل مهمة: سجّل الحالة، ماذا حدث فعليًا، الأرقام، الدليل، العوائق، ثم قرارك. لا تُنقل أي مهمة غير مكتملة تلقائيًا.</div></div>';
  var bySes=grp(c.openAssignments,'SessionNo');
  Object.keys(bySes).sort(function(a,b){return a-b}).forEach(function(n){h+='<h4>مهام أُسندت في الجلسة '+n+'</h4>';bySes[n].forEach(function(a){h+=reviewCard(a)});});
  if(c.routines.length){h+='<h4 style="margin-top:16px">الروتينات المستمرة — سجّل كل مرة كانت مستحقة</h4>';c.routines.forEach(function(r){h+=routineCard(r)});}
  var closed=c.journey.assignments.filter(function(a){return a.IsOpen!=='نعم'});
  if(closed.length){var k='hist_closed';h+='<div class="acc '+(S.openCards[k]?'open':'')+'"><div class="hd" data-act="toggle" data-v="'+k+'"><span class="caret">◀</span><b>مرجع: كل المهام المغلقة سابقًا ('+closed.length+')</b></div>'+(S.openCards[k]?'<div class="bd"><div class="tbl"><table class="t"><tr><th>جلسة</th><th>المهمة</th><th>آخر حالة</th><th>القرار</th><th>النتيجة</th></tr>'+closed.map(function(a){var l=a.reviews[a.reviews.length-1]||{};return '<tr><td>'+a.SessionNo+'</td><td>'+esc(a.TaskName)+'</td><td>'+statusTag(a.CurrentStatus)+'</td><td>'+decTag(a.CurrentDecision)+'</td><td class="sm">'+esc(l.ActualResult||l.ImplementationNote||'')+'</td></tr>'}).join('')+'</table></div></div>':'')+'</div>';}
  return h;}
var ST_CLS=function(o){return {'مكتملة':'ok','مكتملة جزئيًا':'warn','لم تبدأ':'bad','متعثرة':'bad'}[o]||''};
function reviewCard(a){var d=S.d,r=d.reviews[a.AssignmentID],key='rv_'+a.AssignmentID,open=S.openCards[key],P='reviews|'+a.AssignmentID+'|';var act=S.L.action[a.TaskID]||{};
  var complete=r.Status&&r.Decision;var h='<div class="acc '+(open?'open':'')+'" id="'+key+'"><div class="hd" data-act="toggle" data-v="'+key+'"><span class="caret">◀</span><b class="grow">'+esc(a.TaskName)+'</b>'+
    '<span class="tag gray">'+esc(a.AreaName)+'</span><span class="sm mut">الموعد: '+esc(a.CurrentDeadline||a.OriginalDeadline)+'</span>'+(a.reviews.length?'<span class="tag warn">رُوجعت '+a.reviews.length+' مرة — آخرها: '+esc(a.reviews[a.reviews.length-1].Status)+'</span>':'')+
    (complete?statusTag(r.Status)+decTag(r.Decision):'<span class="tag bad">لم تُراجع</span>')+'</div>';
  if(!open)return h+'</div>';
  h+='<div class="bd">';
  h+='<div class="hist"><b>المطلوب كان:</b> '+esc(a.Deliverable)+' | <b>الدليل المطلوب:</b> '+esc(a.EvidenceRequired)+(a.TargetNote?' | <b>المستهدف:</b> '+esc(a.TargetNote):'')+(a.CustomInstructions?'<br><b>تخصيص المنتور:</b> '+esc(a.CustomInstructions):'')+
    (a.reviews.length?'<br><b>المراجعات السابقة:</b> '+a.reviews.map(function(x){return 'ج'+x.SessionNo+': '+x.Status+' ← '+x.Decision+(x.Adjustment?' ('+x.Adjustment+')':'')}).join(' | '):'')+'</div>';
  h+='<label class="f req">حالة التنفيذ</label><div>'+chips(P+'Status',S.boot.constants.statuses,ST_CLS)+'</div>';
  h+='<label class="f'+(r.Status&&r.Status!=='لم تبدأ'?' req':'')+'">ماذا حدث فعليًا؟ <span class="mut">('+esc(a.ReviewQuestion)+')</span></label>'+ta(P+'ImplementationNote','اكتب ما قاله صاحب المشروع وما تم تنفيذه بالتحديد');
  var ms=(a.ResultMetrics||'').split('|').filter(Boolean);
  if(ms.length)h+='<div class="grid g3">'+ms.map(function(m){return '<div><label class="f">'+esc(m)+'</label>'+inp(P+'Metrics|'+m,'number')+'</div>'}).join('')+'</div>';
  var bv=num(r.BeforeValue),av=num(r.AfterValue),df=(bv!==null&&av!==null)?av-bv:null;
  h+='<div class="grid g2"><div><label class="f">النتيجة المتوقعة</label>'+ta(P+'ExpectedResult','','style="min-height:44px"')+'</div><div><label class="f">النتيجة الفعلية (ما الذي تغير؟)</label>'+ta(P+'ActualResult','مثال: 5 طلبات جاءت من المتابعة','style="min-height:44px"')+'</div></div>';
  h+='<div class="grid g4"><div><label class="f">القيمة قبل</label>'+inp(P+'BeforeValue','number')+'</div><div><label class="f">القيمة بعد</label>'+inp(P+'AfterValue','number')+'</div><div><label class="f">الفرق / النسبة</label><input type="text" disabled value="'+(df===null?'—':(df>0?'+':'')+df+(bv?' ('+Math.round(df/Math.abs(bv)*1000)/10+'%)':''))+'"></div><div><label class="f">ملاحظات المنتور</label>'+inp(P+'MentorObservation')+'</div></div>';
  h+='<div class="grid g3"><div><label class="f">نوع الدليل</label><select data-bind="'+P+'EvidenceType"><option value=""></option>'+(S.L.lists['أنواع الدليل']||[]).map(function(o){return '<option'+(r.EvidenceType===o?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select></div><div><label class="f">رابط الدليل (Google Drive أو غيره)</label>'+inp(P+'EvidenceLink','url','https://drive.google.com/…')+'</div><div><label class="f">وصف الدليل / بديل مقبول</label>'+inp(P+'EvidenceNote','text','مثال: شاهدت الدفتر في الجلسة')+'</div></div>';
  if(r.Status&&r.Status!=='مكتملة'&&r.Status!=='قيد التنفيذ'||(r.Barriers||[]).length){h+='<label class="f req">أسباب عدم الإنجاز</label><div>'+chips(P+'Barriers',S.boot.constants.barriers,null,true)+'</div>'+inp(P+'BarrierNote','text','اشرح العائق باختصار');}
  h+='<label class="f req">قرار المنتور</label><div>'+chips(P+'Decision',S.boot.constants.decisions,function(o){return o==='تم الإنجاز'?'ok':o==='إلغاء لعدم الملاءمة'?'bad':''})+'</div>';
  if(['ترحيل بموعد جديد','تعديل/تبسيط','استمرار كما هو','تصعيد/دعم إضافي'].indexOf(r.Decision)>=0)h+='<div class="grid g2"><div><label class="f'+(r.Decision==='ترحيل بموعد جديد'||r.Decision==='تعديل/تبسيط'?' req':'')+'">الموعد الجديد</label>'+inp(P+'NewDeadline','date')+'</div>'+

    (t.TaskID!=='CUSTOM'?'<label class="f">تخصيص/تبسيط للمشروع</label>'+inp(P+'CustomInstructions','text','مثال: ابدئي بالعباية الأكثر طلبًا'):'')+(off?'<label class="f req">مبرر الإسناد من خارج الاستراتيجية</label>'+inp(P+'OffStrategyReason'):'')+'</div>'}).join('')+'</div>';}

  h+='<div class="card"><h4>مهمة من خارج الاستراتيجية أو مهمة مخصصة</h4><div class="row"><select id="extraTask" class="grow" style="width:auto"><option value="">اختر مهمة من المكتبة…</option>'+L.LIB_Areas.map(function(a){return '<optgroup label="'+esc(a.AreaName)+'">'+L.LIB_Actions.filter(function(x){return x.AreaID===a.AreaID&&tasks.indexOf(x.TaskID)<0}).map(function(x){return '<option value="'+x.TaskID+'">'+esc(x.TaskID+' — '+x.TaskName)+'</option>'}).join('')+'</optgroup>'}).join('')+'</select><button class="btn sm sec" data-act="addExtra">إضافة</button><button class="btn sm sec" data-act="addCustom">+ مهمة مخصصة</button></div><div class="sm mut">يتطلب النظام كتابة مبرر لأي مهمة لا ترتبط بالاستراتيجية المختارة، لمنع الإسناد العشوائي.</div></div>';

/* ---- step 7: routines */

  ['روتين أساسي','روتين مرتبط بالاستراتيجية'].concat(c.isRoadmap?['مهمة خريطة الطريق']:[]).forEach(function(tp){var rs=c.routines.filter(function(r){return r.RoutineType===tp});h+='<h4>'+(tp==='روتين أساسي'?'روتينات أساسية مستمرة':tp==='مهمة خريطة الطريق'?'مهام خريطة الطريق المستمرة':'روتينات مرتبطة باستراتيجية')+' ('+rs.length+')</h4>';
    h+=rs.length?rs.map(function(r){var f=routineFinal(r);var warn=tp!=='روتين أساسي'&&r.StrategyID&&cs.indexOf(r.StrategyID)<0&&f==='نشط';return '<div class="row sm" style="padding:4px 0;border-bottom:1px dashed var(--line)"><span class="grow">'+(r.Code?'<span class="tag">'+esc(r.Code)+'</span> ':'')+esc(r.RoutineName)+' <span class="mut">('+esc(r.FrequencyText)+')</span>'+(r.stable?' <span class="tag ok">ثابت ✓</span>':'')+'</span><span class="tag '+(f==='نشط'?'ok':'gray')+'">'+esc(f)+'</span>'+(warn?'<span class="tag warn">الاستراتيجية تغيرت — راجع قرار هذا الروتين في الخطوة 2</span>':'')+'</div>'}).join(''):'<div class="sm mut">لا يوجد.</div>';});
  var lim=S.boot.constants.roadmapNewLimit||2;
  if(c.isRoadmap&&d.newRoutines.length>lim)h+='<div class="box warn sm"><b>تنبيه:</b> قاعدة خريطة الطريق «مفيش أكتر من '+lim+' روتين جداد في الجلسة» — اخترت '+d.newRoutines.length+'. ده تنبيه بس؛ اتأكد إن صاحب المشروع قادر.</div>';
  if(d.newRoutines.length)h+='<h4>روتينات جديدة ستُضاف</h4>'+d.newRoutines.map(function(r,i){var lr=L.routine[r.RoutineID];var P='newRoutines|'+i+'|';return '<div class="card flat" style="padding:8px 10px"><div class="row"><b class="grow">'+(lr.Code?'<span class="tag">'+esc(lr.Code)+'</span> ':'')+esc(lr.RoutineName)+'</b><span class="tag acc">'+esc(lr.RoutineType)+'</span><span class="tag gray">'+esc(lr.FrequencyText)+'</span><button class="btn sm danger" data-act="delRoutine" data-i="'+i+'">إزالة</button></div>'+
    (lr.IsRoadmap?'<div class="sm mut">هنتابعه بـ: '+esc(lr.Evidence)+'</div><div class="grid g3"><div><label class="f req">إمتى وفين</label>'+inp(P+'WhenWhere','text','مثال: كل يوم قبل النوم على الترابيزة')+'</div><div><label class="f">تاريخ البدء</label>'+inp(P+'StartDate','date')+'</div><div><label class="f">الالتزام / ملاحظة</label>'+inp(P+'CustomNote','text','اللي صاحب المشروع وعد بيه')+'</div></div>':
    '<div class="grid g3"><div><label class="f">تاريخ البدء</label>'+inp(P+'StartDate','date')+'</div><div><label class="f">المسؤول</label>'+inp(P+'Responsible','text',lr.Responsible)+'</div><div><label class="f">تخصيص</label>'+inp(P+'CustomNote')+'</div></div>')+'</div>'}).join('');
  h+='</div>';
  var rec=[];cs.forEach(function(sid){ids(L.strategy[sid].RoutineIDs).forEach(function(r){if(rec.indexOf(r)<0)rec.push(r)})});
  var areaOf=d.diagnosis.ProblemID?L.problem[d.diagnosis.ProblemID].AreaID:'';
  var core=L.LIB_Routines.filter(function(r){return r.RoutineType==='روتين أساسي'&&r.AreaID===areaOf&&rec.indexOf(r.RoutineID)<0}).map(function(r){return r.RoutineID});
  var show=function(list,title){var items=list.filter(function(x){return !active[x]&&!added[x]});if(!items.length)return '';return '<h4>'+title+'</h4><div class="grid g2">'+items.map(routineLibCard).join('')+'</div>';};
  if(c.isRoadmap)h+=vRoadmapPicker(active,added);
  h+=show(rec,'روتينات مقترحة للاستراتيجية المختارة')+show(core,'روتينات أساسية في نفس المجال');
  var key='allR';h+='<div class="acc '+(S.openCards[key]?'open':'')+'"><div class="hd" data-act="toggle" data-v="'+key+'"><span class="caret">◀</span><b>كل مكتبة الروتينات ('+L.LIB_Routines.length+')</b></div>'+(S.openCards[key]?'<div class="bd">'+L.LIB_Areas.map(function(a){var items=L.LIB_Routines.filter(function(r){return r.AreaID===a.AreaID&&!active[r.RoutineID]&&!added[r.RoutineID]});return '<h4>'+esc(a.AreaName)+'</h4><div class="grid g2">'+items.map(function(r){return routineLibCard(r.RoutineID)}).join('')+'</div>'}).join('')+'</div>':'')+'</div>';
  return h;}
/** Roadmap library (Assiut): suggestions come from checklist items scored «لأ/ساعات» today — money first — then the full filterable library. */
function vRoadmapPicker(active,added){var d=S.d,L=S.L,f=S.rmf||(S.rmf={freq:'',dom:'',q:''});var mode=d.projectMode;
  var ok=function(id){var t=L.roadmap[id];return t&&!active[id]&&!added[id]&&appliesMode(t.AppliesTo,mode)};
  var sug=[],why={};S.ctx.checklistItems.forEach(function(it){var v=(d.checklist[it.ItemID]||{}).Value;if(v!=='لأ'&&v!=='ساعات')return;
    ids(it.RoadmapIDs).forEach(function(id){if(ok(id)&&sug.indexOf(id)<0){sug.push(id);why[id]='«'+it.RoutineText+'» = '+v}})});
  var h='<div class="card"><h3>🗺 مكتبة خريطة الطريق — أسيوط ('+L.roadmapList.length+' مهمة)</h3><div class="sm mut">اختار مع صاحب المشروع روتين أو اتنين بس، والأولوية لروتينات الفلوس. كل مهمة بتتابع كروتين (يومي/أسبوعي/كل أسبوعين/شهري) ولازم تكتب «إمتى وفين».</div>';
  var more=S.openCards.rmMore,shown=more?sug:sug.slice(0,6);
  h+=sug.length?'<h4>مقترحة من تشيك ليست النهارده ('+sug.length+')</h4><div class="grid g2">'+shown.map(function(id){return rmCard(id,why[id])}).join('')+'</div>'+(sug.length>6?'<button class="btn sm ghost" data-act="toggle" data-v="rmMore">'+(more?'عرض أول 6 بس':'عرض باقي الاقتراحات ('+(sug.length-6)+')')+'</button>':''):'<div class="sm mut" style="margin:6px 0">'+(Object.keys(d.checklist).length?'مفيش اقتراحات: قيّم التشيك ليست في خطوة 3 أو كل البنود المرتبطة متسندة بالفعل.':'قيّم التشيك ليست في خطوة 3 عشان تظهر الاقتراحات.')+'</div>';
  var key='allRM',open=S.openCards[key];
  h+='<div class="acc '+(open?'open':'')+'"><div class="hd" data-act="toggle" data-v="'+key+'"><span class="caret">◀</span><b>كل مكتبة خريطة الطريق</b></div>';
  if(open){var doms=[];L.roadmapList.forEach(function(t){if(doms.indexOf(t.Domain)<0)doms.push(t.Domain)});var q=normAr(f.q);
    var list=L.roadmapList.filter(function(t){return ok(t.RoadmapID)&&(!f.freq||t.FrequencyCode===f.freq)&&(!f.dom||t.Domain===f.dom)&&(!q||normAr(t.TaskText+' '+t.Code+' '+t.ExpectedResult).indexOf(q)>=0)});
    h+='<div class="bd"><div class="grid g3"><div><label class="f">التكرار</label><select data-act="rmf" data-k="freq"><option value="">الكل</option>'+[['DAILY','يومي'],['WEEKLY','أسبوعي'],['BIWEEKLY','كل أسبوعين'],['MONTHLY','شهري']].map(function(x){return '<option value="'+x[0]+'"'+(f.freq===x[0]?' selected':'')+'>'+x[1]+'</option>'}).join('')+'</select></div>'+
      '<div><label class="f">المجال</label><select data-act="rmf" data-k="dom"><option value="">الكل</option>'+doms.map(function(x){return '<option'+(f.dom===x?' selected':'')+'>'+esc(x)+'</option>'}).join('')+'</select></div>'+
      '<div><label class="f">بحث</label><input type="text" id="rmq" data-act="rmq" value="'+esc(f.q)+'" placeholder="كلمة أو كود"></div></div><div class="sm mut">'+list.length+' مهمة'+(mode?' مناسبة لمشروع «'+esc(mode)+'»':'')+'</div><div class="grid g2">'+list.slice(0,60).map(function(t){return rmCard(t.RoadmapID)}).join('')+'</div>'+(list.length>60?'<div class="sm mut">ضيّق البحث لعرض الباقي.</div>':'')+'</div>';}
  return h+'</div></div>';}
function rmCard(id,why){var t=S.L.roadmap[id];if(!t)return '';
  return '<div class="card" style="margin:0"><div><span class="tag">'+esc(t.Code)+'</span> <span class="tag gray">'+esc(t.FrequencyText)+'</span></div><div class="b" style="margin:4px 0">'+esc(t.TaskText)+'</div>'+
    '<div class="sm"><b>النتيجة:</b> '+esc(t.ExpectedResult)+'</div><div class="sm"><b>المؤشر:</b> '+esc(t.Indicator)+'</div><div class="sm mut">'+esc(t.Domain)+' · يوم '+esc(t.ProgramDay)+(t.AppliesTo!=='كل المشاريع'?' · '+esc(t.AppliesTo):'')+(t.Origin==='جديد'?' · <b>جديدة</b>':'')+'</div>'+

function routineLibCard(rid){var r=S.L.routine[rid];if(!r)return '';var key='rl_'+rid,open=S.openCards[key];return '<div class="card" style="margin:0"><div class="row"><b class="grow">'+esc(r.RoutineName)+'</b><span class="tag acc">'+esc(r.RoutineType)+'</span><span class="tag gray">'+esc(r.FrequencyText)+'</span></div><div class="sm">'+esc(r.Purpose)+'</div><div class="eg sm">'+esc(r.SummaryEg)+'</div><div class="sm mut">الملاءمة: '+esc(r.Applicability)+'</div>'+
  (open?'<ol class="steps sm">'+(S.L.rsteps[rid]||[]).map(function(s){return '<li><b>'+esc(s.StepTitle)+':</b> '+esc(s.Instruction)+'</li>'}).join('')+'</ol><div class="sm"><b>بديل ورقي:</b> '+esc(r.PaperAlternative)+'</div>':'')+
  '<div class="row"><button class="btn sm ghost" data-act="toggle" data-v="'+key+'">'+(open?'إخفاء':'الخطوات')+'</button><span class="grow"></span><button class="btn sm" data-act="addRoutine" data-v="'+rid+'">+ إضافة</button></div></div>';}

/* ---- step 8: workload */
function minutes(t){t=String(t||'');var m=t.match(/(\d+(?:\.\d+)?)/);if(!m)return 0;var n=+m[1];if(/ساع/.test(t))return n*60;if(/أسبوع/.test(t))return n*240;if(/يوم/.test(t))return n*120;return n;}
function workload(){var d=S.d,L=S.L,c=S.ctx;var cont=c.openAssignments.filter(function(a){var r=d.reviews[a.AssignmentID];return ['تم الإنجاز','إلغاء لعدم الملاءمة','تقسيم لمهام أصغر','إيقاف مؤقت'].indexOf(r.Decision)<0});
  var subs=0;c.openAssignments.forEach(function(a){var r=d.reviews[a.AssignmentID];if(r.Decision==='تقسيم لمهام أصغر')subs+=(r.SubTasks||[]).filter(function(x){return x.name}).length});
  var rs=c.routines.filter(function(r){return routineFinal(r)==='نشط'}).map(function(r){return r.FrequencyCode}).concat(d.newRoutines.map(function(r){return (L.routine[r.RoutineID]||{}).FrequencyCode}));
  var cnt=function(k){return rs.filter(function(x){return x===k}).length};var mins=d.newTasks.reduce(function(s,t){return s+minutes((L.action[t.TaskID]||{}).EstimatedTime)},0);
  return {newT:d.newTasks.length+subs,cont:cont.length,daily:cnt('DAILY'),weekly:cnt('WEEKLY'),monthly:cnt('MONTHLY'),periodic:cnt('PERIODIC'),hours:Math.round(mins/60*10)/10};}
function st8(){var d=S.d,w=workload(),L=S.L;var h='<div class="card"><h3>8. تقييم حجم العمل</h3><div class="tiles">'+tile(w.newT,'مهام جديدة')+tile(w.cont,'مهام سابقة مستمرة')+tile(w.daily,'روتين يومي')+tile(w.weekly,'روتين أسبوعي')+tile(w.monthly+w.periodic,'شهري/دوري')+tile(w.hours,'ساعات تقديرية للمهام الجديدة')+'</div></div>';
  h+='<div class="card"><div class="b" style="font-size:16px">اسأل صاحب المشروع:</div><div class="box info" style="font-size:16px">«على مقياس من 1 إلى 5، شايف إنك قادر تنفذ المهام دي خلال الأسبوع؟»</div><div>'+[1,2,3,4,5].map(function(n){return '<span class="chip '+(n<=2?'bad':n>=4?'ok':'warn')+(String(d.readiness)===String(n)?' on':'')+'" data-act="readiness" data-v="'+n+'" style="font-size:16px;padding:6px 16px">'+n+'</span>'}).join('')+'</div>';
  if(d.readiness&&+d.readiness<=2){var opt=d.newTasks.filter(function(t){return (L.action[t.TaskID]||{}).Priority!=='أساسي'});h+='<div class="box bad"><b>الاستعداد منخفض.</b> اقتراحات: قلّل المهام الجديدة إلى مهمة واحدة أساسية، بسّط المهام المستمرة، أو أجّل الروتينات الأقل أهمية.'+(opt.length?'<br>مهام غير أساسية يمكن تأجيلها: '+opt.map(function(t){return esc((L.action[t.TaskID]||{}).TaskName||t.TaskName)}).join('، '):'')+'</div><label class="f req">ماذا قررتما؟ (مطلوب إذا بقيت أكثر من مهمة جديدة)</label>'+ta('workloadNote');}
  else if(d.readiness)h+='<label class="f">ملاحظة (اختياري)</label>'+ta('workloadNote');
  return h+'</div>';}

/* ---- step 9: final review */
function st9(){var d=S.d,L=S.L,c=S.ctx;var h='<div class="card"><h3>9. المراجعة النهائية للخطة</h3><div class="kv"><b>المشكلة:</b> '+esc((L.problem[d.diagnosis.ProblemID]||{}).ProblemName||'—')+' | <b>الاستراتيجية:</b> '+esc((L.strategy[d.strategy.PrimaryStrategyID]||{}).StrategyName||'—')+(d.strategy.SupportingStrategyID?' + '+esc(L.strategy[d.strategy.SupportingStrategyID].StrategyName):'')+'</div></div>';

  h+='</div><div class="card"><h4>2) مهام سابقة مستمرة بقرار المنتور</h4>'+c.openAssignments.map(function(a){var r=d.reviews[a.AssignmentID];if(['تم الإنجاز','إلغاء لعدم الملاءمة','تقسيم لمهام أصغر'].indexOf(r.Decision)>=0)return '';return '<div class="row sm" style="border-bottom:1px dashed var(--line);padding:4px 0"><span class="grow">'+esc(a.TaskName)+'</span>'+statusTag(r.Status)+decTag(r.Decision)+'<span>'+esc(r.NewDeadline||'')+'</span><span class="mut">'+esc(r.Adjustment||'')+'</span></div>'}).join('')+'</div>';
  var act=c.routines.filter(function(r){return routineFinal(r)==='نشط'});h+='<div class="card"><h4>3–4) الروتينات المستمرة والجديدة</h4>'+act.map(function(r){return '<span class="tag '+(r.RoutineType==='روتين أساسي'?'':'acc')+'">'+esc(r.RoutineName)+'</span>'}).join('')+d.newRoutines.map(function(r){return '<span class="tag ok">+ '+esc(L.routine[r.RoutineID].RoutineName)+'</span>'}).join('')+'</div>';

function clientChecks(){var d=S.d,c=S.ctx,e=[];var pr=reviewProgress();if(pr.done<pr.total)e.push('أكمل مراجعة كل المهام السابقة ('+pr.done+'/'+pr.total+')');if(pr.rdone<pr.rtotal)e.push('أكمل مراجعة الروتينات ('+pr.rdone+'/'+pr.rtotal+')');
  if(!d.diagnosis.ProblemID)e.push('اختر المشكلة ذات الأولوية');if(!d.strategy.PrimaryStrategyID)e.push('اختر الاستراتيجية الأساسية');if(!d.readiness)e.push('سجّل درجة الاستعداد');
  if(!c.isFirstSession&&!d.businessResultNote)e.push('اكتب النتيجة الفعلية للأعمال (الخطوة 3)');d.newTasks.forEach(function(t){if(!t.Deadline)e.push('حدد موعد كل مهمة جديدة')});
  if(c.isRoadmap){if(!d.projectMode)e.push('حدد نوع المشروع (الخطوة 3 — تشيك ليست الروتينات)');var miss=c.checklistItems.filter(function(it){return !(d.checklist[it.ItemID]||{}).Value}).length;if(miss)e.push('قيّم كل بنود تشيك ليست الروتينات — ناقص '+miss+' (الخطوة 3)');
    d.newRoutines.forEach(function(r){var lr=S.L.routine[r.RoutineID]||{};if(lr.IsRoadmap&&!String(r.WhenWhere||'').trim())e.push('اكتب «إمتى وفين» لـ '+lr.Code+' (الخطوة 7)')});}
  return e;}
function clientWarnings(){var d=S.d,c=S.ctx,w=[],lim=S.boot.constants.roadmapNewLimit||2;if(c.isRoadmap&&d.newRoutines.length>lim)w.push('قاعدة خريطة الطريق: مفيش أكتر من '+lim+' روتين جداد في الجلسة — اخترت '+d.newRoutines.length+'.');return w;}

function rateTile(v,l,sub){var c=v===null?'':v>=70?'ok':v>=40?'warn':'bad';return '<div class="tile '+c+'"><div class="n">'+pct(v)+'</div><div class="l">'+esc(l)+'</div><div class="bar" style="margin-top:4px"><i style="width:'+(v||0)+'%"></i></div><div class="sm mut">'+esc(sub)+'</div></div>';}

  addSub:function(){var r=S.d.reviews[el.getAttribute('data-a')];r.SubTasks=r.SubTasks||[];r.SubTasks.push({name:'',deadline:S.d.planEnd});keepScroll(render)},
  delSub:function(){S.d.reviews[el.getAttribute('data-a')].SubTasks.splice(+el.getAttribute('data-i'),1);keepScroll(render)},
  occ:function(){var rr=S.d.routineReviews[el.getAttribute('data-ra')],k=el.getAttribute('data-k');var i=OCC_CYCLE.indexOf(rr.occ[k]||'');rr.occ[k]=OCC_CYCLE[(i+1)%OCC_CYCLE.length]||'تم';S.dirty=true;keepScroll(render)},
  occAll:function(){var rr=S.d.routineReviews[el.getAttribute('data-ra')];Object.keys(rr.occ).forEach(function(k){if(rr.occ[k]!=='غير مستحق/إجازة')rr.occ[k]=v});S.dirty=true;keepScroll(render)},
  addKpi:function(){var k=document.getElementById('addKpi').value;if(!k)return;S.d.kpiValues[k]=S.d.kpiValues[k]||{Value:'',Source:''};S.dirty=true;keepScroll(render)},
  continueFocus:function(){var p=S.ctx.previousSession;var D=S.d.diagnosis;D.AreaID=p.FocusAreaID;D.ProblemID=p.FocusProblemID;D.ContinuedFocus=true;(p.diagnoses||[]).forEach(function(x){if(!D.causes[x.CauseID])D.causes[x.CauseID]={Classification:x.Classification,EvidenceNote:x.EvidenceNote}});S.d.strategy.PrimaryStrategyID=S.d.strategy.PrimaryStrategyID||p.PrimaryStrategyID;S.dirty=true;render()},
  pickArea:function(){S.d.diagnosis.AreaID=v;if(S.d.diagnosis.ProblemID&&S.L.problem[S.d.diagnosis.ProblemID].AreaID!==v){S.d.diagnosis.ProblemID='';S.d.diagnosis.causes={};}S.dirty=true;keepScroll(render)},
  pickProblem:function(){var D=S.d.diagnosis;if(D.ProblemID!==v){D.ProblemID=v;D.causes={};D.ContinuedFocus=!!(S.ctx.previousSession&&S.ctx.previousSession.FocusProblemID===v);if(S.d.strategy.PrimaryStrategyID&&S.L.strategy[S.d.strategy.PrimaryStrategyID].ProblemID!==v)S.d.strategy.PrimaryStrategyID='';}S.dirty=true;keepScroll(render)},
  pickStrategy:function(){S.d.strategy.PrimaryStrategyID=v;if(S.d.strategy.SupportingStrategyID===v)S.d.strategy.SupportingStrategyID='';S.dirty=true;keepScroll(render)},
  addTask:function(){var a=S.L.action[v];S.d.newTasks.push({TaskID:v,Deadline:addDays(S.d.planEnd,-1),Responsible:'',CustomInstructions:'',TargetNote:'',ExpectedResult:'',OffStrategyReason:''});S.dirty=true;keepScroll(render);toast('أضيفت: '+a.TaskName)},
  addExtra:function(){var t=document.getElementById('extraTask').value;if(!t)return;if(S.d.newTasks.some(function(x){return x.TaskID===t})){toast('مضافة بالفعل');return;}if(openByTask()[t]){toast('هذه المهمة مسندة ومفتوحة بالفعل');return;}S.d.newTasks.push({TaskID:t,Deadline:addDays(S.d.planEnd,-1),OffStrategyReason:''});S.dirty=true;render()},
  addCustom:function(){S.d.newTasks.push({TaskID:'CUSTOM',TaskName:'',CustomInstructions:'',Deadline:addDays(S.d.planEnd,-1),OffStrategyReason:''});S.dirty=true;render()},
  delTask:function(){S.d.newTasks.splice(+el.getAttribute('data-i'),1);S.dirty=true;keepScroll(render)},
  addRoutine:function(){S.d.newRoutines.push({RoutineID:v,StartDate:S.d.sessionDate,Responsible:'',CustomNote:'',WhenWhere:''});S.dirty=true;keepScroll(render);toast('أضيف الروتين')},
  pickMentor:function(){S.mentorId=v;lsSet('athar_mentor',v);document.getElementById('mentorSel').value=v;closeModal();render()},
  setMode:function(){S.d.projectMode=v;applyModeNA(S.d,S.ctx);S.dirty=true;keepScroll(render)},
  clCopy:function(){var prev=S.ctx.previousChecklist||{},n=0;S.ctx.checklistItems.forEach(function(it){var c=S.d.checklist[it.ItemID]=S.d.checklist[it.ItemID]||{Value:'',Note:''};if(!c.Value&&prev[it.ItemID]&&prev[it.ItemID].Value){c.Value=prev[it.ItemID].Value;n++;}});S.dirty=true;keepScroll(render);toast('اتنسخ '+n+' بند — راجعهم مع صاحب المشروع')},
  delRoutine:function(){S.d.newRoutines.splice(+el.getAttribute('data-i'),1);S.dirty=true;keepScroll(render)},
  readiness:function(){S.d.readiness=v;S.dirty=true;keepScroll(render)},
  finalize:finalize,discard:function(){if(!confirm('حذف المسودة؟ لن تتأثر أي جلسة محفوظة.'))return;run(call('discardDraft',S.ctx.session.SessionID)).then(function(){S.dirty=false;openProject(S.ctx.project.ProjectID)})},
  printPlan:function(){var f=document.getElementById('planFrame');f.contentWindow.focus();f.contentWindow.print()},
  planMode:function(){if(v==='a4'&&!S.plan.a4){run(call('sessionSheetHtml',S.plan.sid),'تجهيز ملخص الجلسة…').then(function(h){S.plan.a4=h;S.plan.mode='a4';render()});return;}S.plan.mode=v;render()},
  pdfPlan:function(){run(call('savePlanPdf',S.plan.sid,S.plan.mode==='a4'?'a4':''),'إنشاء PDF في Google Drive…').then(function(r){modal('<h3>تم حفظ الخطة</h3><a href="'+esc(r.url)+'" target="_blank">'+esc(r.name)+'</a><div class="row" style="justify-content:flex-end"><button class="btn" data-act="closeModal">حسنًا</button></div>')})},
  copyPlan:function(){var t=S.plan.text;if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){toast('تم النسخ')},function(){prompt('انسخ النص:',t)});else prompt('انسخ النص:',t)},
  applyDash:loadDash,resetDash:function(){S.df={};loadDash()}};
  if(H[a]){e.preventDefault();H[a]();}});
function payload(){var d=S.d,c=S.ctx;return {sessionDate:d.sessionDate,planEnd:d.planEnd,businessResultNote:d.businessResultNote,readiness:d.readiness,workloadNote:d.workloadNote,mentorSummary:d.mentorSummary,
  projectMode:c.isRoadmap?d.projectMode:'',afterTrainingDay:c.isRoadmap?d.afterTrainingDay:'',
  checklist:c.isRoadmap?c.checklistItems.map(function(it){var x=d.checklist[it.ItemID]||{};return {ItemID:it.ItemID,Value:x.Value||'',Note:x.Note||''}}):[],
  reviews:c.openAssignments.map(function(a){var r=JSON.parse(JSON.stringify(d.reviews[a.AssignmentID]));r.AssignmentID=a.AssignmentID;return r}),
  routineReviews:c.routines.map(function(r){var rr=d.routineReviews[r.RAID];return {RAID:r.RAID,Decision:rr.Decision,Note:rr.Note,EvidenceLink:rr.EvidenceLink,NewNote:rr.NewNote,Responsible:rr.Responsible,EvidenceSeen:rr.EvidenceSeen||'',
    occurrences:r.slots.map(function(s){return {DueDate:s.DueDate,PeriodLabel:s.PeriodLabel,Status:rr.occ[s.DueDate+'#'+s.PeriodLabel]}})}}),
  kpiValues:Object.keys(d.kpiValues).filter(function(k){return d.kpiValues[k].Value!==''&&d.kpiValues[k].Value!==undefined}).map(function(k){return {KPIID:k,Value:d.kpiValues[k].Value,Source:d.kpiValues[k].Source}}),
  newProjectKPIs:Object.keys(d.newProjectKPIs).map(function(k){return {KPIID:k,TargetValue:d.newProjectKPIs[k].TargetValue}}),
  diagnosis:{ProblemID:d.diagnosis.ProblemID,ContinuedFocus:d.diagnosis.ContinuedFocus,causes:Object.keys(d.diagnosis.causes).map(function(k){return {CauseID:k,Classification:d.diagnosis.causes[k].Classification,EvidenceNote:d.diagnosis.causes[k].EvidenceNote}})},
  strategy:d.strategy,newTasks:d.newTasks,newRoutines:d.newRoutines};}
function finalize(){var sid=S.ctx.session.SessionID,pid=S.ctx.project.ProjectID;run(call('finalize',sid,payload()),'حفظ الجلسة…').then(function(){S.dirty=false;toast('تم حفظ الجلسة');return call('journey',pid)}).then(function(j){S.journey=j;S.ctx=null;S.d=null;openPlan(sid);});}
init();
</script>
</body>
