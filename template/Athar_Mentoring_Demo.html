<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أثر — نظام المنتورينج</title>
<style>
:root{--pri:#145a63;--pri2:#1d7480;--pri-l:#e7f1f2;--acc:#c7902b;--acc-l:#fbf3e3;--ok:#2f8a55;--ok-l:#e6f4ec;--warn:#b7791f;--warn-l:#fdf3e1;--bad:#b4413a;--bad-l:#fbe9e7;
--ink:#1c2a2f;--mut:#617076;--line:#d9e4e6;--bg:#f5f8f8;--card:#fff;--r:10px}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:"Noto Naskh Arabic","Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri2)}
.top{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 14px;flex-wrap:wrap}
.top .brand{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px}.logo{width:30px;height:30px;border-radius:8px;background:#fff;color:var(--pri);display:grid;place-items:center;font-weight:800}
.top .sp{flex:1}.top select{width:auto;max-width:220px;background:#ffffff1f;border:1px solid #ffffff55;color:#fff;border-radius:8px;padding:4px 8px}.top select option{color:#000}
.navb{background:transparent;border:1px solid #ffffff55;color:#fff;border-radius:8px;padding:5px 12px;cursor:pointer}.navb.on{background:#fff;color:var(--pri);font-weight:700}
.wrap{max-width:1180px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.card.flat{box-shadow:none}.card h3{margin:0 0 8px;font-size:16px}
h2{font-size:19px;margin:6px 0 10px;color:var(--pri)}h4{margin:8px 0 6px;font-size:14.5px;color:var(--pri)}
.btn{border:1px solid var(--pri);background:var(--pri);color:#fff;border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:600}
.btn.sec{background:#fff;color:var(--pri)}.btn.ghost{background:transparent;border-color:transparent;color:var(--pri2);padding:4px 8px}
.btn.warn{background:var(--acc);border-color:var(--acc)}.btn.danger{background:#fff;color:var(--bad);border-color:var(--bad)}.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grow{flex:1}
.grid{display:grid;gap:10px}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
label.f{display:block;font-size:13px;color:var(--mut);margin:6px 0 2px}
input[type=text],input[type=date],input[type=number],input[type=url],select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff}
textarea{min-height:64px;resize:vertical}input:focus,select:focus,textarea:focus{outline:2px solid #1d748055;border-color:var(--pri2)}
.mut{color:var(--mut)}.sm{font-size:12.5px}.b{font-weight:700}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 11px;margin:3px;cursor:pointer;font-size:13px;user-select:none}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}.chip.ok.on{background:var(--ok);border-color:var(--ok)}.chip.bad.on{background:var(--bad);border-color:var(--bad)}.chip.warn.on{background:var(--warn);border-color:var(--warn)}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:1px 9px;background:var(--pri-l);color:var(--pri);margin:1px 2px;white-space:nowrap}
.tag.ok{background:var(--ok-l);color:var(--ok)}.tag.warn{background:var(--warn-l);color:var(--warn)}.tag.bad{background:var(--bad-l);color:var(--bad)}.tag.acc{background:var(--acc-l);color:#8a6418}.tag.gray{background:#eef1f2;color:#5a666b}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.tile{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px}.tile .n{font-size:22px;font-weight:800;color:var(--pri)}.tile .l{font-size:12.5px;color:var(--mut)}
.tile.ok .n{color:var(--ok)}.tile.bad .n{color:var(--bad)}.tile.warn .n{color:var(--warn)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff}table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 7px;text-align:right;vertical-align:top}
table.t th{background:#f0f5f6;font-weight:700;color:#33474d;position:sticky;top:0}table.t tr.click{cursor:pointer}table.t tr.click:hover{background:#f7fbfb}
.tbl{overflow:auto;max-width:100%;border:1px solid var(--line);border-radius:8px}
.stepper{display:flex;gap:4px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:thin}
.stp{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.stp.on{background:var(--pri);color:#fff;border-color:var(--pri)}.stp.done{border-color:var(--ok);color:var(--ok)}.stp.lock{opacity:.5}
.foot{position:sticky;bottom:0;background:#fffffff2;border-top:1px solid var(--line);padding:8px 14px;display:flex;gap:8px;align-items:center;z-index:15;backdrop-filter:blur(3px)}
.acc{border:1px solid var(--line);border-radius:var(--r);background:#fff;margin:8px 0;overflow:hidden}
.acc>.hd{padding:10px 12px;display:flex;gap:8px;align-items:center;cursor:pointer;flex-wrap:wrap}.acc>.hd:hover{background:#f7fbfb}.acc>.bd{padding:10px 12px;border-top:1px solid var(--line)}
.acc.open>.hd{background:var(--pri-l)}.caret{transition:transform .15s;display:inline-block}.acc.open .caret{transform:rotate(-90deg)}
.box{border-radius:8px;padding:8px 10px;margin:6px 0}.box.info{background:var(--pri-l)}.box.warn{background:var(--warn-l);color:#7a5413}.box.bad{background:var(--bad-l);color:#8b2f29}.box.ok{background:var(--ok-l);color:#1f6a40}
.eg{background:#f4faf5;border-right:4px solid var(--ok);padding:6px 10px;border-radius:4px;margin:6px 0}
.steps{margin:6px 0;padding-inline-start:20px}.steps li{margin:3px 0}
.sel{outline:2px solid var(--pri);background:var(--pri-l)!important}
.opt{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:#fff;cursor:pointer}.opt:hover{border-color:var(--pri2)}
.dots{display:flex;gap:3px;flex-wrap:wrap}.dot{width:12px;height:12px;border-radius:3px;background:#dfe6e8}.dot.d{background:var(--ok)}.dot.p{background:var(--warn)}.dot.m{background:var(--bad)}.dot.n{background:#f1f3f4;border:1px dashed #c3ccce}
.slot{border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12px;cursor:pointer;background:#fff;min-width:74px;text-align:center}
.slot.d{background:var(--ok-l);border-color:var(--ok);color:var(--ok)}.slot.p{background:var(--warn-l);border-color:var(--warn);color:var(--warn)}.slot.m{background:var(--bad-l);border-color:var(--bad);color:var(--bad)}.slot.n{background:#f4f6f6;color:#8a9599;border-style:dashed}
.bar{height:9px;background:#e7eeef;border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--pri2)}
.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;z-index:50;padding:10px}.modal>.card{width:min(720px,100%);max-height:92vh;overflow:auto}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#1c2a2f;color:#fff;padding:8px 16px;border-radius:8px;z-index:60;max-width:90vw}
.load{position:fixed;inset:0;background:#ffffffb0;display:grid;place-items:center;z-index:70;font-weight:700;color:var(--pri)}
.testflag{background:#fff3cd;color:#7a5b00;border:1px dashed #c9a227;border-radius:6px;padding:1px 8px;font-size:12px}
.pcard{cursor:pointer;transition:border-color .1s}.pcard:hover{border-color:var(--pri2)}
.kv{font-size:13.5px;margin:2px 0}.kv b{color:var(--pri)}
.hist{font-size:12.5px;background:#fafcfc;border:1px dashed var(--line);border-radius:8px;padding:6px 8px;margin:6px 0}
.req::after{content:" *";color:var(--bad)}
iframe.plan{width:100%;height:72vh;border:1px solid var(--line);border-radius:var(--r);background:#fff}
@media (max-width:640px){.wrap{padding:8px}.card{padding:10px}.top .brand span.t{display:none}.foot{flex-wrap:wrap}}
@media print{.top,.foot,.noprint{display:none!important}}
</style>
</head>

/* ------------------------------------------------------------------ helpers */
function AppError(msg) { var e = new Error(msg); e.isAppError = true; return e; }
function str_(v) { return v === null || v === undefined ? '' : String(v).trim(); }
function num_(v) { if (v === '' || v === null || v === undefined) return null; var n = Number(String(v).replace(/,/g, '')); return isNaN(n) ? null : n; }
function ids_(s) { return str_(s).split(/[,،;؛|\s]+/).filter(function (x) { return x; }); }
function uniq_(a) { var s = {}, o = []; a.forEach(function (x) { if (x && !s[x]) { s[x] = 1; o.push(x); } }); return o; }
function index_(arr, key) { var m = {}; arr.forEach(function (r) { m[r[key]] = r; }); return m; }
function group_(arr, key) { var m = {}; arr.forEach(function (r) { (m[r[key]] = m[r[key]] || []).push(r); }); return m; }
function pad_(n, w) { var s = String(n); while (s.length < w) s = '0' + s; return s; }
function dParse_(s) { var p = str_(s).slice(0, 10).split('-'); if (p.length < 3) return null; return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
function dFmt_(t) { var d = new Date(t); return d.getUTCFullYear() + '-' + pad_(d.getUTCMonth() + 1, 2) + '-' + pad_(d.getUTCDate(), 2); }
function dAdd_(s, n) { return dFmt_(dParse_(s) + n * 86400000); }
function dDiff_(a, b) { return Math.round((dParse_(b) - dParse_(a)) / 86400000); }
function dow_(s) { return new Date(dParse_(s)).getUTCDay(); }
function isDate_(s) { return /^\d{4}-\d{2}-\d{2}$/.test(str_(s)) && dParse_(s) !== null; }
function maxDate_(a, b) { if (!a) return b; if (!b) return a; return a > b ? a : b; }
var DAY_NAMES_ = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];

function nextId_(table, field, prefix, width) {
  var max = 0, re = new RegExp('^' + prefix.replace(/[-]/g, '\\-') + '(\\d+)$');
  DB.all(table).forEach(function (r) { var m = re.exec(str_(r[field])); if (m) max = Math.max(max, +m[1]); });
  return function () { max++; return prefix + pad_(max, width || 5); };
}
function log_(gen, projectId, sessionId, action, entity, entityId, details, dataType) {
  return { LogID: gen(), Timestamp: DB.now(), User: DB.user(), ProjectID: projectId, SessionID: sessionId || '', Action: action,
    Entity: entity, EntityID: entityId || '', Details: details || '', DataType: dataType || C.REAL };
}

/* ------------------------------------------------------------------ library */
var LIBX_ = null;
function lib_() {
  if (LIBX_) return LIBX_;
  var L = {};
  LIB_TABLES.forEach(function (t) { L[t] = DB.lib(t); });
  L.area = index_(L.LIB_Areas, 'AreaID');
  L.problem = index_(L.LIB_Problems, 'ProblemID');
  L.cause = index_(L.LIB_Causes, 'CauseID');
  L.strategy = index_(L.LIB_Strategies, 'StrategyID');
  L.action = index_(L.LIB_Actions, 'TaskID');
  L.routine = index_(L.LIB_Routines, 'RoutineID');
  L.kpi = index_(L.LIB_KPIs, 'KPIID');
  L.steps = group_(L.LIB_ActionSteps, 'TaskID');
  L.rsteps = group_(L.LIB_RoutineSteps, 'RoutineID');
  Object.keys(L.steps).forEach(function (k) { L.steps[k].sort(function (a, b) { return a.StepNo - b.StepNo; }); });
  Object.keys(L.rsteps).forEach(function (k) { L.rsteps[k].sort(function (a, b) { return a.StepNo - b.StepNo; }); });
  LIBX_ = L;
  return L;
}
function resetLibCache_() { LIBX_ = null; }
function stepsText_(taskId) {
  var s = lib_().steps[taskId] || [];
  return s.map(function (x) { return x.StepNo + '. ' + x.StepTitle + ': ' + x.Instruction; }).join('\n');
}

/* ------------------------------------------------------------------ bootstrap & projects */
function apiBootstrap() {
  var L = lib_();
  var library = {};
  ['LIB_Areas', 'LIB_Problems', 'LIB_Causes', 'LIB_Strategies', 'LIB_Actions', 'LIB_ActionSteps', 'LIB_Routines',
    'LIB_RoutineSteps', 'LIB_KPIs', 'LIB_Sources', 'LIB_Lists'].forEach(function (t) { library[t] = L[t]; });
  return { library: library, mentors: DB.all('DB_Mentors').filter(function (m) { return m.Active !== C.NO; }),
    user: DB.user(), today: DB.today(), constants: { barriers: C.BARRIERS, statuses: C.TASK_STATUSES, decisions: C.TASK_DECISIONS,
      routineDecisions: C.ROUTINE_DECISIONS, occStatuses: C.OCC_STATUSES, newTasksSoftLimit: C.NEW_TASKS_SOFT_LIMIT } };
}

function apiListProjects(opts) {
  opts = opts || {};
  var mentors = index_(DB.all('DB_Mentors'), 'MentorID');
  var sessions = group_(DB.all('DB_Sessions'), 'ProjectID');
  var asg = group_(DB.all('DB_TaskAssignments'), 'ProjectID');
  return DB.all('DB_Projects').filter(function (p) { return opts.includeTest || p.DataType !== C.TEST; }).map(function (p) {
    var ss = (sessions[p.ProjectID] || []);
    var saved = ss.filter(function (s) { return s.Status === C.SES_SAVED; }).sort(function (a, b) { return a.SessionNo - b.SessionNo; });
    var draft = ss.filter(function (s) { return s.Status === C.SES_DRAFT; })[0];
    var last = saved[saved.length - 1];
    var open = (asg[p.ProjectID] || []).filter(function (a) { return a.IsOpen === C.YES; }).length;
    return { ProjectID: p.ProjectID, ProjectName: p.ProjectName, OwnerName: p.OwnerName, BusinessType: p.BusinessType, Governorate: p.Governorate,
      Round: p.Round, Status: p.Status, DataType: p.DataType, MentorID: p.MentorID, MentorName: (mentors[p.MentorID] || {}).MentorName || '',
      SessionsCount: saved.length, LastSessionNo: last ? last.SessionNo : 0, LastSessionDate: last ? last.SessionDate : '',
      NextSessionDate: last ? last.PlanEnd : '', OpenTasks: open, DraftSessionID: draft ? draft.SessionID : '',
      LastProblem: last && last.FocusProblemID ? (lib_().problem[last.FocusProblemID] || {}).ProblemName : '' };
  });
}

function apiCreateProject(p) {
  p = p || {};
  ['ProjectName', 'OwnerName', 'BusinessType', 'MentorID'].forEach(function (f) {
    if (!str_(p[f])) throw AppError('الحقل مطلوب: ' + SCHEMA_LABELS.DB_Projects[SCHEMA.DB_Projects.indexOf(f)]);
  });
  return DB.withLock(function () {
    var all = DB.all('DB_Projects');
    var dup = all.filter(function (x) { return str_(x.ProjectName) === str_(p.ProjectName) && str_(x.OwnerName) === str_(p.OwnerName); });
    if (dup.length) throw AppError('يوجد مشروع بنفس الاسم وصاحب المشروع: ' + dup[0].ProjectID);
    var isTest = p.DataType === C.TEST;
    var gen = nextId_('DB_Projects', 'ProjectID', isTest ? 'TEST-PRJ-' : 'PRJ-', 4);
    var row = { ProjectID: gen(), ProjectName: str_(p.ProjectName), OwnerName: str_(p.OwnerName), Phone: str_(p.Phone),
      BusinessType: str_(p.BusinessType), Governorate: str_(p.Governorate), Location: str_(p.Location), Round: str_(p.Round),
      MentorID: str_(p.MentorID), StartDate: isDate_(p.StartDate) ? p.StartDate : DB.today(), Status: str_(p.Status) || 'نشط',
      Description: str_(p.Description), DataType: isTest ? C.TEST : C.REAL, CreatedAt: DB.now(), CreatedBy: DB.user() };
    DB.insert('DB_Projects', [row]);
    var lg = nextId_('DB_SessionHistory', 'LogID', 'LOG-', 6);
    DB.insert('DB_SessionHistory', [log_(lg, row.ProjectID, '', 'إنشاء مشروع', 'Project', row.ProjectID, row.ProjectName, row.DataType)]);
    return row;
  });
}

function apiCreateMentor(m) {
  if (!str_(m && m.MentorName)) throw AppError('اسم المنتور مطلوب');
  return DB.withLock(function () {
    var gen = nextId_('DB_Mentors', 'MentorID', m.DataType === C.TEST ? 'TEST-M-' : 'M-', 3);
    var row = { MentorID: gen(), MentorName: str_(m.MentorName), Email: str_(m.Email), Phone: str_(m.Phone), Active: C.YES,
      DataType: m.DataType === C.TEST ? C.TEST : C.REAL, CreatedAt: DB.now() };
    DB.insert('DB_Mentors', [row]);
    return row;
  });
}

/* ------------------------------------------------------------------ journey */
function routineStats_(ra, occs) {
  var mine = occs.filter(function (o) { return o.RAID === ra.RAID; });
  var planned = mine.filter(function (o) { return o.IsPlanned === C.YES; }).length;
  var done = mine.filter(function (o) { return o.IsDone === C.YES; }).length;
  return { planned: planned, done: done, rate: planned ? Math.round(done / planned * 1000) / 10 : null, occurrences: mine };
}

function apiGetJourney(projectId) {
  var L = lib_();
  var p = DB.all('DB_Projects').filter(function (x) { return x.ProjectID === projectId; })[0];
  if (!p) throw AppError('المشروع غير موجود: ' + projectId);
  var mentors = index_(DB.all('DB_Mentors'), 'MentorID');
  var sessions = DB.all('DB_Sessions').filter(function (s) { return s.ProjectID === projectId; }).sort(function (a, b) { return a.SessionNo - b.SessionNo; });
  var asg = DB.all('DB_TaskAssignments').filter(function (a) { return a.ProjectID === projectId; });
  var revs = DB.all('DB_TaskReviews').filter(function (r) { return r.ProjectID === projectId; });
  var revBy = group_(revs, 'AssignmentID');
  var ras = DB.all('DB_RoutineAssignments').filter(function (r) { return r.ProjectID === projectId; });
  var occs = DB.all('DB_RoutineOccurrences').filter(function (o) { return o.ProjectID === projectId; });
  var diags = DB.all('DB_Diagnoses').filter(function (d) { return d.ProjectID === projectId; });
  var pk = DB.all('DB_ProjectKPIs').filter(function (k) { return k.ProjectID === projectId; });
  var kv = DB.all('DB_KPIValues').filter(function (k) { return k.ProjectID === projectId; });
  var evid = DB.all('DB_Evidence').filter(function (e) { return e.ProjectID === projectId; });

  asg.forEach(function (a) {
    a.reviews = (revBy[a.AssignmentID] || []).sort(function (x, y) { return x.SessionNo - y.SessionNo; });
    var act = L.action[a.TaskID] || {};
    a.Purpose = act.Purpose || ''; a.SummaryEg = act.SummaryEg || '';
    a.ProblemName = (L.problem[a.ProblemID] || {}).ProblemName || '';
    a.StrategyName = (L.strategy[a.StrategyID] || {}).StrategyName || '';
    a.AreaName = (L.area[a.AreaID] || {}).AreaName || '';
    a.ReviewQuestion = act.ReviewQuestion || 'ماذا نُفذ فعليًا؟ وما النتيجة؟';
    a.ResultMetrics = act.ResultMetrics || '';
    a.everCarried = a.reviews.some(function (r) { return r.Decision === C.DEC_CARRY; });
  });
  ras.forEach(function (r) {
    var st = routineStats_(r, occs);
    r.planned = st.planned; r.done = st.done; r.rate = st.rate;
    r.occurrences = st.occurrences.sort(function (a, b) { return a.DueDate < b.DueDate ? -1 : 1; });
    var lr = L.routine[r.RoutineID] || {};
    r.Purpose = lr.Purpose || ''; r.FrequencyText = lr.FrequencyText || '';
    r.AreaName = (L.area[r.AreaID] || {}).AreaName || '';
    r.StrategyName = (L.strategy[r.StrategyID] || {}).StrategyName || '';
  });
  sessions.forEach(function (s) {
    s.MentorName = (mentors[s.MentorID] || {}).MentorName || '';
    s.ProblemName = (L.problem[s.FocusProblemID] || {}).ProblemName || '';
    s.StrategyName = (L.strategy[s.PrimaryStrategyID] || {}).StrategyName || '';
    s.SupportingStrategyName = (L.strategy[s.SupportingStrategyID] || {}).StrategyName || '';
    s.diagnoses = diags.filter(function (d) { return d.SessionID === s.SessionID; }).map(function (d) {
      d.CauseText = (L.cause[d.CauseID] || {}).CauseText || ''; return d; });
    delete s.DraftJSON;
  });
  var kpis = pk.map(function (k) {
    var lk = L.kpi[k.KPIID] || {};
    var vals = kv.filter(function (v) { return v.KPIID === k.KPIID; }).sort(function (a, b) { return a.SessionNo - b.SessionNo || (a.PeriodEnd < b.PeriodEnd ? -1 : 1); });
    var first = vals[0], last = vals[vals.length - 1];
    var change = (first && last && vals.length > 1) ? last.Value - first.Value : null;
    return { KPIID: k.KPIID, KPIName: lk.KPIName, Unit: lk.Unit, Direction: lk.Direction, BaselineValue: k.BaselineValue, TargetValue: k.TargetValue,
      Active: k.Active, values: vals, change: change,
      changePct: (change !== null && first.Value) ? Math.round(change / Math.abs(first.Value) * 1000) / 10 : null };
  });
  var improvement = asg.filter(function (a) { return a.TaskType === C.T_IMPROVE; });
  var stats = {
    sessions: sessions.filter(function (s) { return s.Status === C.SES_SAVED; }).length,
    assigned: improvement.length,
    completed: improvement.filter(function (a) { return a.CurrentDecision === C.DEC_DONE; }).length,
    partial: improvement.filter(function (a) { return a.IsOpen === C.YES && a.CurrentStatus === C.ST_PART; }).length,
    notDone: improvement.filter(function (a) { return a.IsOpen === C.YES && (a.CurrentStatus === C.ST_NOT || a.CurrentStatus === C.ST_BLOCK); }).length,
    inProgress: improvement.filter(function (a) { return a.IsOpen === C.YES && a.CurrentStatus === C.ST_PROG; }).length,
    carried: improvement.filter(function (a) { return a.everCarried; }).length,
    open: improvement.filter(function (a) { return a.IsOpen === C.YES; }).length,
    cancelled: improvement.filter(function (a) { return a.CurrentDecision === C.DEC_CANCEL; }).length,
    routinesActive: ras.filter(function (r) { return r.Status === C.RS_ACTIVE; }).length,
    routinePlanned: occs.filter(function (o) { return o.IsPlanned === C.YES; }).length,
    routineDone: occs.filter(function (o) { return o.IsDone === C.YES; }).length,
    evidenceCount: evid.length
  };
  p.MentorName = (mentors[p.MentorID] || {}).MentorName || '';
  return { project: p, sessions: sessions, assignments: asg, routines: ras, kpis: kpis, stats: stats, evidence: evid };
}

/* ------------------------------------------------------------------ session start / draft */
function routineSlots_(ra, from, to, allOccs) {
  // returns due occurrence slots for the review period [from, to] (inclusive)
  var start = maxDate_(ra.StartDate, from);
  if (!start || !to || start > to) return [];
  var already = {};
  allOccs.filter(function (o) { return o.RAID === ra.RAID; }).forEach(function (o) { already[o.DueDate + '|' + o.PeriodLabel] = 1; });
  var slots = [], days = dDiff_(start, to) + 1, times = Math.max(1, num_(ra.TimesPerPeriod) || 1), i, k;
  if (ra.FrequencyCode === 'DAILY') {
    var s0 = days > C.MAX_DAILY_SLOTS ? dAdd_(to, -(C.MAX_DAILY_SLOTS - 1)) : start;
    for (i = 0; i <= dDiff_(s0, to); i++) {
      var d = dAdd_(s0, i);
      slots.push({ DueDate: d, PeriodLabel: DAY_NAMES_[dow_(d)] + ' ' + d.slice(5), defaultStatus: C.WEEKEND.indexOf(dow_(d)) >= 0 ? C.OCC_NA : '' });
    }
  } else if (ra.FrequencyCode === 'WEEKLY') {
    var weeks = Math.max(1, Math.round(days / 7));
    for (i = 0; i < weeks; i++) for (k = 1; k <= times; k++) {
      var due = dAdd_(start, Math.min(days - 1, i * 7 + 6));
      slots.push({ DueDate: due, PeriodLabel: 'أسبوع ' + (i + 1) + (times > 1 ? ' — مرة ' + k : ''), defaultStatus: '' });
    }
  } else if (ra.FrequencyCode === 'MONTHLY') {
    var prev = allOccs.filter(function (o) { return o.RAID === ra.RAID && o.IsPlanned === C.YES; }).map(function (o) { return o.DueDate; }).sort();
    var anchor = prev.length ? dAdd_(prev[prev.length - 1], 1) : ra.StartDate;
    var n = Math.floor((dDiff_(anchor, to) + 1) / 28);
    for (i = 1; i <= n; i++) slots.push({ DueDate: dAdd_(anchor, Math.min(i * 28 - 1, dDiff_(anchor, to))), PeriodLabel: 'شهر ' + i, defaultStatus: '' });
  } else { // PERIODIC / event-based
    slots.push({ DueDate: to, PeriodLabel: 'عند الحدث (' + from + ' → ' + to + ')', defaultStatus: '' });
  }
  return slots.filter(function (s) { return !already[s.DueDate + '|' + s.PeriodLabel]; });
}

function sessionContext_(session) {
  var L = lib_();
  var j = apiGetJourney(session.ProjectID);
  var open = j.assignments.filter(function (a) { return a.IsOpen === C.YES && a.SessionID !== session.SessionID; })
    .sort(function (a, b) { return a.SessionNo - b.SessionNo; });
  var allOccs = DB.all('DB_RoutineOccurrences');
  var reviewTo = dAdd_(session.SessionDate, -1);
  var routines = j.routines.filter(function (r) { return r.Status === C.RS_ACTIVE || r.Status === C.RS_PAUSED; }).map(function (r) {
    r.slots = r.Status === C.RS_ACTIVE ? routineSlots_(r, session.ReviewFrom, reviewTo, allOccs) : [];
    r.steps = L.rsteps[r.RoutineID] || [];
    return r;
  });
  var saved = j.sessions.filter(function (s) { return s.Status === C.SES_SAVED; });
  var prev = saved[saved.length - 1] || null;
  return { session: session, project: j.project, openAssignments: open, routines: routines, previousSession: prev,
    journey: j, isFirstSession: saved.length === 0 };
}

function apiStartSession(projectId, mentorId, sessionDate) {
  return DB.withLock(function () {
    var p = DB.all('DB_Projects').filter(function (x) { return x.ProjectID === projectId; })[0];
    if (!p) throw AppError('المشروع غير موجود');
    var ss = DB.all('DB_Sessions').filter(function (s) { return s.ProjectID === projectId; });
    var draft = ss.filter(function (s) { return s.Status === C.SES_DRAFT; })[0];
    if (draft) return sessionContext_(draft);   // resume, never create a second draft
    var saved = ss.filter(function (s) { return s.Status === C.SES_SAVED; }).sort(function (a, b) { return a.SessionNo - b.SessionNo; });
    var last = saved[saved.length - 1];
    var date = isDate_(sessionDate) ? sessionDate : DB.today();
    if (last && date < last.SessionDate) throw AppError('تاريخ الجلسة لا يمكن أن يسبق آخر جلسة محفوظة (' + last.SessionDate + ')');
    var no = (last ? +last.SessionNo : 0) + 1;
    var s = { SessionID: projectId + '-S' + pad_(no, 2), ProjectID: projectId, SessionNo: no, SessionDate: date,
      MentorID: str_(mentorId) || p.MentorID, Round: p.Round, ReviewFrom: last ? last.SessionDate : p.StartDate,
      PlanStart: date, PlanEnd: dAdd_(date, 7), Status: C.SES_DRAFT, DataType: p.DataType, CreatedAt: DB.now(), DraftJSON: '' };
    DB.insert('DB_Sessions', [s]);
    var lg = nextId_('DB_SessionHistory', 'LogID', 'LOG-', 6);
    DB.insert('DB_SessionHistory', [log_(lg, projectId, s.SessionID, 'بدء جلسة', 'Session', s.SessionID, 'جلسة رقم ' + no, p.DataType)]);
    return sessionContext_(s);
  });
}

function apiSaveDraft(sessionId, draft) {
  var s = DB.all('DB_Sessions').filter(function (x) { return x.SessionID === sessionId; })[0];
  if (!s) throw AppError('الجلسة غير موجودة');
  if (s.Status !== C.SES_DRAFT) throw AppError('الجلسة محفوظة بالفعل ولا يمكن تعديلها');
  DB.update('DB_Sessions', 'SessionID', sessionId, { DraftJSON: typeof draft === 'string' ? draft : JSON.stringify(draft || {}) });
  return { ok: true, savedAt: DB.now() };
}
function apiGetDraft(sessionId) {
  var s = DB.all('DB_Sessions').filter(function (x) { return x.SessionID === sessionId; })[0];
  if (!s) throw AppError('الجلسة غير موجودة');
  var ctx = sessionContext_(s);
  ctx.draft = s.DraftJSON ? JSON.parse(s.DraftJSON) : null;
  return ctx;
}
function apiDiscardDraft(sessionId) {
  return DB.withLock(function () {
    var s = DB.all('DB_Sessions').filter(function (x) { return x.SessionID === sessionId; })[0];
    if (!s || s.Status !== C.SES_DRAFT) throw AppError('لا توجد مسودة بهذا المعرف');
    DB.remove('DB_Sessions', 'SessionID', sessionId);   // a draft holds no history yet
    var lg = nextId_('DB_SessionHistory', 'LogID', 'LOG-', 6);
    DB.insert('DB_SessionHistory', [log_(lg, s.ProjectID, sessionId, 'حذف مسودة', 'Session', sessionId, '', s.DataType)]);
    return { ok: true };
  });
}

/* ------------------------------------------------------------------ suggestions used by the UI */
function apiSuggest(problemId, causeIds) {
  var L = lib_();
  var pr = L.problem[problemId];
  if (!pr) throw AppError('مشكلة غير معروفة');
  var sel = ids_(causeIds);
  var strategies = ids_(pr.StrategyIDs).map(function (sid) {
    var s = L.strategy[sid]; var c = ids_(s.CauseIDs);
    var matched = c.filter(function (x) { return sel.indexOf(x) >= 0; });
    return { StrategyID: sid, matched: matched.length, matchedCauses: matched };
  }).sort(function (a, b) { return b.matched - a.matched; });
  return { strategies: strategies, kpis: ids_(pr.KPIIDs) };
}

/* ------------------------------------------------------------------ finalize */
function validateFinalize_(ctx, P) {
  var errs = [], L = lib_();
  var rv = index_(P.reviews || [], 'AssignmentID');
  ctx.openAssignments.forEach(function (a) {
    var r = rv[a.AssignmentID], nm = '«' + a.TaskName + '»';
    if (!r) { errs.push('لم تتم مراجعة المهمة ' + nm); return; }
    if (C.TASK_STATUSES.indexOf(r.Status) < 0) errs.push('حدد حالة تنفيذ المهمة ' + nm);
    if (C.TASK_DECISIONS.indexOf(r.Decision) < 0) errs.push('حدد قرار المنتور للمهمة ' + nm);
    if (r.Decision === C.DEC_DONE && r.Status !== C.ST_DONE) errs.push('لا يمكن اعتماد الإنجاز والحالة ليست «مكتملة»: ' + nm);
    if ((r.Decision === C.DEC_CARRY || r.Decision === C.DEC_MOD) && !isDate_(r.NewDeadline)) errs.push('حدد الموعد الجديد للمهمة ' + nm);
    if (r.NewDeadline && isDate_(r.NewDeadline) && r.NewDeadline < P.sessionDate) errs.push('الموعد الجديد يسبق تاريخ الجلسة: ' + nm);
    if ((r.Decision === C.DEC_MOD || r.Decision === C.DEC_ESC) && !str_(r.Adjustment)) errs.push('اكتب التعديل أو الدعم المطلوب للمهمة ' + nm);
    if (r.Decision === C.DEC_SPLIT && !(r.SubTasks || []).filter(function (x) { return str_(x.name); }).length) errs.push('أضف مهمة فرعية واحدة على الأقل عند تقسيم ' + nm);
    if ([C.ST_NOT, C.ST_BLOCK, C.ST_PART].indexOf(r.Status) >= 0 && !(r.Barriers || []).length) errs.push('اختر سبب عدم الإنجاز للمهمة ' + nm);
    if (r.Status !== C.ST_NOT && !str_(r.ImplementationNote)) errs.push('اكتب ماذا نُفذ فعليًا في المهمة ' + nm);
  });
  ctx.routines.forEach(function (r) {
    var rr = (P.routineReviews || []).filter(function (x) { return x.RAID === r.RAID; })[0];
    if (!rr || C.ROUTINE_DECISIONS.indexOf(rr.Decision) < 0) { errs.push('حدد قرار الروتين «' + r.RoutineName + '»'); return; }
    (rr.occurrences || []).forEach(function (o) { if (C.OCC_STATUSES.indexOf(o.Status) < 0) errs.push('حدد حالة كل مرة مستحقة في روتين «' + r.RoutineName + '» (' + o.PeriodLabel + ')'); });
    if (r.slots.length && (rr.occurrences || []).length !== r.slots.length) errs.push('سجل كل المرات المستحقة لروتين «' + r.RoutineName + '»');
  });
  var D = P.diagnosis || {};
  if (!L.problem[D.ProblemID]) errs.push('اختر المشكلة ذات الأولوية');
  else {
    var valid = (D.causes || []).filter(function (c) { return L.cause[c.CauseID] && L.cause[c.CauseID].ProblemID === D.ProblemID && (c.Classification === C.DIAG_CONF || c.Classification === C.DIAG_LIKELY); });
    if (!valid.length) errs.push('صنّف سببًا واحدًا على الأقل كمؤكد أو مرجح');
  }
  var S = P.strategy || {};
  var ps = L.strategy[S.PrimaryStrategyID];
  if (!ps) errs.push('اختر الاستراتيجية الأساسية');
  else if (L.problem[D.ProblemID] && ps.ProblemID !== D.ProblemID) errs.push('الاستراتيجية الأساسية لا تخص المشكلة المختارة');
  if (S.SupportingStrategyID) {
    if (!L.strategy[S.SupportingStrategyID]) errs.push('الاستراتيجية المساندة غير معروفة');
    if (S.SupportingStrategyID === S.PrimaryStrategyID) errs.push('الاستراتيجية المساندة يجب أن تختلف عن الأساسية');
    if (!str_(S.SupportJustification)) errs.push('اكتب مبرر الاستراتيجية المساندة');
  }
  var chosen = [S.PrimaryStrategyID, S.SupportingStrategyID].filter(function (x) { return x; });
  // tasks that will remain open after this session's decisions
  var stillOpen = {};
  ctx.openAssignments.forEach(function (a) { var r = rv[a.AssignmentID]; if (r && C.CLOSING_DECISIONS.indexOf(r.Decision) < 0 && a.TaskID !== 'CUSTOM') stillOpen[a.TaskID] = a; });
  var seen = {};
  (P.newTasks || []).forEach(function (t) {
    var act = L.action[t.TaskID];
    if (t.TaskID === 'CUSTOM') { if (!str_(t.TaskName)) errs.push('اكتب اسم المهمة المخصصة'); if (!str_(t.CustomInstructions)) errs.push('اكتب خطوات تنفيذ المهمة المخصصة «' + str_(t.TaskName) + '»'); }
    else if (!act) { errs.push('مهمة غير معروفة: ' + t.TaskID); return; }
    var nm = '«' + (act ? act.TaskName : t.TaskName) + '»';
    if (t.TaskID !== 'CUSTOM') {
      if (seen[t.TaskID]) errs.push('المهمة مكررة في الخطة: ' + nm);
      seen[t.TaskID] = 1;
      if (stillOpen[t.TaskID]) errs.push('المهمة ' + nm + ' مسندة بالفعل ومفتوحة (' + stillOpen[t.TaskID].AssignmentID + ')؛ استخدم قرار الاستمرار بدل إسنادها مرة أخرى');
      var inStrategy = ids_(act.StrategyIDs).some(function (x) { return chosen.indexOf(x) >= 0; });
      if (!inStrategy && !str_(t.OffStrategyReason)) errs.push('المهمة ' + nm + ' ليست ضمن الاستراتيجية المختارة؛ اكتب مبرر الإسناد');
    } else if (!str_(t.OffStrategyReason)) errs.push('اكتب سبب إضافة المهمة المخصصة «' + str_(t.TaskName) + '»');
    if (!isDate_(t.Deadline)) errs.push('حدد موعد تسليم المهمة ' + nm);
    else if (t.Deadline < P.sessionDate) errs.push('موعد المهمة يسبق تاريخ الجلسة: ' + nm);
  });
  var activeAfter = {};
  ctx.routines.forEach(function (r) {
    var rr = (P.routineReviews || []).filter(function (x) { return x.RAID === r.RAID; })[0] || {};
    var willBe = rr.Decision === C.R_END ? C.RS_ENDED : rr.Decision === C.R_PAUSE ? C.RS_PAUSED : rr.Decision === C.R_RESUME ? C.RS_ACTIVE : r.Status;
    if (willBe !== C.RS_ENDED) activeAfter[r.RoutineID] = r;
  });
  var seenR = {};
  (P.newRoutines || []).forEach(function (r) {
    var lr = L.routine[r.RoutineID];
    if (!lr) { errs.push('روتين غير معروف: ' + r.RoutineID); return; }
    if (seenR[r.RoutineID]) errs.push('الروتين مكرر: «' + lr.RoutineName + '»');
    seenR[r.RoutineID] = 1;
    if (activeAfter[r.RoutineID]) errs.push('الروتين «' + lr.RoutineName + '» مسند بالفعل لهذا المشروع؛ عدّله أو أعد تفعيله بدل تكراره');
  });
  var rd = num_(P.readiness);
  if (!(rd >= 1 && rd <= 5)) errs.push('سجّل درجة استعداد صاحب المشروع من 1 إلى 5');
  else if (rd <= 2 && (P.newTasks || []).length > 1 && !str_(P.workloadNote)) errs.push('الاستعداد منخفض: قلّل المهام أو اكتب سبب الإبقاء عليها');
  if (!isDate_(P.planEnd) || P.planEnd <= P.sessionDate) errs.push('حدد موعد الجلسة التالية بعد تاريخ هذه الجلسة');
  if (!ctx.isFirstSession && !str_(P.businessResultNote)) errs.push('اكتب النتيجة الفعلية للأعمال منذ الجلسة السابقة (حتى لو: لا تغيير بعد)');
  (P.kpiValues || []).forEach(function (k) { if (!L.kpi[k.KPIID]) errs.push('مؤشر غير معروف: ' + k.KPIID); else if (num_(k.Value) === null) errs.push('قيمة غير رقمية للمؤشر «' + L.kpi[k.KPIID].KPIName + '»'); });
  return errs;
}

function apiFinalizeSession(sessionId, P) {
  return DB.withLock(function () {
    var L = lib_();
    var s = DB.all('DB_Sessions').filter(function (x) { return x.SessionID === sessionId; })[0];
    if (!s) throw AppError('الجلسة غير موجودة');
    if (s.Status !== C.SES_DRAFT) throw AppError('هذه الجلسة محفوظة بالفعل؛ لا يتم تعديل السجلات التاريخية');
    P = P || {};
    P.sessionDate = isDate_(P.sessionDate) ? P.sessionDate : s.SessionDate;
    if (P.sessionDate !== s.SessionDate) { s.SessionDate = P.sessionDate; s.PlanStart = P.sessionDate; }
    var ctx = sessionContext_(s);
    var errs = validateFinalize_(ctx, P);
    if (errs.length) { var e = AppError('لا يمكن حفظ الجلسة قبل استكمال ما يلي:\n• ' + errs.join('\n• ')); e.details = errs; throw e; }

    var p = ctx.project, dt = p.DataType, now = DB.now(), user = DB.user(), date = P.sessionDate;
    var common = { MentorID: s.MentorID, Round: s.Round, DataType: dt };
    var gRev = nextId_('DB_TaskReviews', 'ReviewID', 'REV-', 6), gAsg = nextId_('DB_TaskAssignments', 'AssignmentID', 'ASG-', 6),
        gEv = nextId_('DB_Evidence', 'EvidenceID', 'EVD-', 6), gOcc = nextId_('DB_RoutineOccurrences', 'OccurrenceID', 'OCC-', 7),
        gRA = nextId_('DB_RoutineAssignments', 'RAID', 'RA-', 5), gKV = nextId_('DB_KPIValues', 'ValueID', 'KV-', 6),
        gPK = nextId_('DB_ProjectKPIs', 'PKID', 'PK-', 5), gDx = nextId_('DB_Diagnoses', 'DiagnosisID', 'DX-', 6),
        gLog = nextId_('DB_SessionHistory', 'LogID', 'LOG-', 6);
    var reviews = [], evidence = [], newAsg = [], occRows = [], logs = [], asgUpdates = [], raUpdates = [];
    var rv = index_(P.reviews || [], 'AssignmentID');

    // 1) review of previous tasks (append-only) + refresh of derived cache columns
    ctx.openAssignments.forEach(function (a) {
      var r = rv[a.AssignmentID];

function apiGetPlan(sessionId) {

  if (!s) throw AppError('الجلسة غير موجودة');
  if (s.Status !== C.SES_SAVED) throw AppError('احفظ الجلسة أولًا لتوليد الخطة');
  var p = DB.all('DB_Projects').filter(function (x) { return x.ProjectID === s.ProjectID; })[0];
  var mentor = DB.all('DB_Mentors').filter(function (m) { return m.MentorID === s.MentorID; })[0] || {};
  var asg = DB.all('DB_TaskAssignments').filter(function (a) { return a.ProjectID === s.ProjectID; });
  var revs = DB.all('DB_TaskReviews').filter(function (r) { return r.SessionID === s.SessionID; });
  var revBy = index_(revs, 'AssignmentID');
  var dx = DB.all('DB_Diagnoses').filter(function (d) { return d.SessionID === s.SessionID && d.Classification !== C.DIAG_NA; });
  var strat = L.strategy[s.PrimaryStrategyID] || {};
  var newTasks = asg.filter(function (a) { return a.SessionID === s.SessionID; }).map(function (a) {
    var act = L.action[a.TaskID] || {};
    var steps = a.TaskID === 'CUSTOM' ? [] : (L.steps[a.TaskID] || []);
    return { AssignmentID: a.AssignmentID, TaskID: a.TaskID, TaskName: a.TaskName, Why: act.Purpose || a.CustomInstructions, Summary: act.SummaryEg || '',
      Steps: steps.map(function (x) { return { no: x.StepNo, title: x.StepTitle, text: x.Instruction }; }),
      Snapshot: a.TaskID === 'CUSTOM' ? a.StepsSnapshot : '', CustomInstructions: a.CustomInstructions, Deadline: a.OriginalDeadline,
      Responsible: a.Responsible, Deliverable: a.Deliverable, Evidence: a.EvidenceRequired, Target: a.TargetNote, Alternative: act.LowResourceAlternative || '',
      Cautions: act.Cautions || '', Origin: a.Origin, Time: act.EstimatedTime || '' };
  });
  // reproduced from this session's own review records, so an old plan always shows what was decided at that time
  var continuing = asg.filter(function (a) { var r = revBy[a.AssignmentID]; return r && C.CLOSING_DECISIONS.indexOf(r.Decision) < 0; }).map(function (a) {
    var r = revBy[a.AssignmentID];

      Deadline: r.NewDeadline, Adjustment: r.Adjustment, Paused: r.Decision === C.DEC_PAUSE, Summary: (L.action[a.TaskID] || {}).SummaryEg || a.CustomInstructions };
  });
  var ras = DB.all('DB_RoutineAssignments').filter(function (r) {
    return r.ProjectID === s.ProjectID && r.StartDate <= s.PlanEnd && (r.Status === C.RS_ACTIVE || (r.EndDate && r.EndDate > s.SessionDate)); });

  ras.forEach(function (r) {
    var lr = L.routine[r.RoutineID] || {};
    (groups[r.FrequencyCode] || groups.PERIODIC).push({ RAID: r.RAID, RoutineName: r.RoutineName, RoutineType: r.RoutineType, Frequency: lr.FrequencyText,
      Summary: lr.SummaryEg, Steps: (L.rsteps[r.RoutineID] || []).map(function (x) { return { no: x.StepNo, title: x.StepTitle, text: x.Instruction }; }),
      Output: lr.Output, Evidence: lr.Evidence, Responsible: r.Responsible, CustomNote: r.CustomNote, Paper: lr.PaperAlternative, IsNew: r.StartSessionID === s.SessionID });
  });

    header: { ProjectName: p.ProjectName, OwnerName: p.OwnerName, BusinessType: p.BusinessType, MentorName: mentor.MentorName || '', Round: s.Round,
      SessionNo: s.SessionNo, SessionDate: s.SessionDate, PlanStart: s.PlanStart, PlanEnd: s.PlanEnd, DataType: p.DataType, Readiness: s.Readiness },

      Strategy: strat.StrategyName, StrategyAim: strat.Aim, Expected: strat.ExpectedResults,
      Supporting: (L.strategy[s.SupportingStrategyID] || {}).StrategyName || '', Continued: s.ContinuedFocus === C.YES },

/* In-memory implementation of the DB adapter — used by automated tests and by the offline demo.
   Mirrors SheetDb semantics: every value read back is a string or a number ('' for empty). */
function MemoryDb(tables, opts) {
  opts = opts || {};
  var T = tables || {};
  var clock = opts.clock || null;
  function norm(table, row) {
    var o = {};
    (SCHEMA[table] || Object.keys(row)).forEach(function (k) {
      var v = row[k];
      if (v === null || v === undefined) v = '';
      else if (NUMBER_FIELDS.indexOf(k) >= 0 && v !== '') { var n = Number(v); v = isNaN(n) ? String(v) : n; }
      else if (typeof v === 'boolean') v = v ? 'نعم' : 'لا';
      else if (typeof v !== 'number') v = String(v);
      o[k] = v;
    });
    return o;
  }
  var api = {
    tables: T,
    all: function (t) { return (T[t] || []).map(function (r) { return Object.assign({}, r); }); },
    lib: function (t) { return T[t] || []; },
    insert: function (t, rows) { T[t] = T[t] || []; rows.forEach(function (r) { T[t].push(norm(t, r)); }); },
    update: function (t, key, val, patch) {
      var r = (T[t] || []).filter(function (x) { return x[key] === val; })[0];
      if (!r) throw new Error('update: row not found ' + t + ' ' + val);
      var n = norm(t, Object.assign({}, r, patch));
      Object.keys(n).forEach(function (k) { r[k] = n[k]; });
    },
    remove: function (t, key, val) { T[t] = (T[t] || []).filter(function (x) { return x[key] !== val; }); },
    withLock: function (fn) { return fn(); },
    now: function () { var d = clock ? clock() : new Date(); return d.toISOString().slice(0, 16).replace('T', ' '); },
    today: function () { var d = clock ? clock() : new Date(); return d.toISOString().slice(0, 10); },
    user: function () { return opts.user || 'demo@athar'; }
  };
  return api;
}

function testFill_(ctx, spec) {

    if (!r) throw new Error('scenario missing review for ' + a.TaskID + ' ' + a.TaskName);
    return Object.assign({ AssignmentID: a.AssignmentID }, r);
  });
  var routineReviews = ctx.routines.map(function (r) {
    var rs = (spec.routines || {})[r.RoutineID] || { pattern: '1', Decision: C.R_CONT };
    var pat = rs.pattern || '1', i = 0;
    var occ = r.slots.map(function (s) {
      if (s.defaultStatus === C.OCC_NA) return { DueDate: s.DueDate, PeriodLabel: s.PeriodLabel, Status: C.OCC_NA };
      var ch = pat.charAt(i++ % pat.length);
      return { DueDate: s.DueDate, PeriodLabel: s.PeriodLabel, Status: ch === '1' ? C.OCC_DONE : ch === 'p' ? C.OCC_PART : ch === 'n' ? C.OCC_NA : C.OCC_MISS };
    });
    return { RAID: r.RAID, occurrences: occ, Decision: rs.Decision || C.R_CONT, Note: rs.Note || '', EvidenceLink: rs.EvidenceLink || '', NewNote: rs.NewNote || '' };
  });
  return Object.assign({}, spec.payload, { reviews: reviews, routineReviews: routineReviews });
}

function loadTestData_() {
  var existing = DB.all('DB_Projects').filter(function (p) { return p.DataType === C.TEST; });
  if (existing.length) throw AppError('البيانات التجريبية محملة بالفعل؛ احذفها أولًا من القائمة.');
  var mentor = apiCreateMentor({ MentorName: 'منتورة تجريبية — سارة (تجريبي)', Email: '', DataType: C.TEST });
  var out = [];
  testScenarios_().forEach(function (sc) {
    var p = apiCreateProject(Object.assign({ MentorID: mentor.MentorID, DataType: C.TEST }, sc.project));
    sc.sessions.forEach(function (ss) {
      var ctx = apiStartSession(p.ProjectID, mentor.MentorID, ss.date);
      var payload = testFill_(ctx, ss);
      payload.sessionDate = ss.date;
      var res = apiFinalizeSession(ctx.session.SessionID, payload);
      out.push(p.ProjectID + ' S' + ctx.session.SessionNo + ': ' + JSON.stringify(res));
    });
  });
  return out;
}

Origin": "Excel"}, {"TaskID": "MK-A02", "StepNo": 3, "StepTitle": "تحديد عوامل الاختيار", "Instruction": "اختر أهم 2–3 عوامل من السعر والجودة والسرعة والمقاس والقرب والثقة والتخصيص بناءً على المقابلات.", "CheckQuestion": "هل العوامل مدعومة بأمثلة؟", "Origin": "Excel"}, {"TaskID": "MK-A02", "StepNo": 4, "StepTitle": "تحديد مكان الوصول", "Instruction": "اكتب الأماكن أو القنوات التي يمكن الوصول فيها لهذه الفئة: سوق، محلات، منطقة، مجموعات مناسبة، WhatsApp أو Facebook.", "CheckQuestion": "هل القناة متاحة للمشروع؟", "Origin": "Excel"}, {"TaskID": "MK-A02", "StepNo": 5, "StepTitle": "صياغة البطاقة والتحقق", "Instruction": "اكتب 4–6 أسطر عن العميل واحتياجه ولماذا قد يختار المشروع، ثم اعرضها على عميلين واسألهما هل تصفهما بدقة.", "CheckQuestion": "هل تم حفظ البطاقة وملاحظات التحقق؟", "Origin": "Excel"}, {"TaskID": "MK-A03", "StepNo": 1, "StepTitle": "اختيار البدائل", "Instruction": "حدد 5 مشروعات أو منتجات يستخدمها العميل لحل الاحتياج نفسه، مباشرة أو غير مباشرة.", "CheckQuestion": "هل البدائل حقيقية؟", "Origin": "Excel"}, {"TaskID": "MK-A03", "StepNo": 2, "StepTitle": "جمع معلومات موحدة", "Instruction": "سجل المنتج والسعر وتاريخ الرصد والحجم/المواصفات والتغليف والتوصيل وطريقة الطلب.", "CheckQuestion": "هل المقارنة على نفس وحدة القياس؟", "Origin": "Excel"}, {"TaskID": "MK-A03", "StepNo": 3, "StepTitle": "رصد نقاط القوة والقصور", "Instruction": "اكتب ما يظهر بوضوح في كل عرض وما لا يقدمه، مع تجنب التخمين بشأن جودة لا تستطيع فحصها.", "CheckQuestion": "هل الملاحظات قابلة للتحقق؟", "Origin": "Excel"}, {"TaskID": "MK-A03", "StepNo": 4, "StepTitle": "استخراج فرصة", "Instruction": "حدد فجوة واحدة يستطيع المشروع تقديمها بموارده: تخصيص، سرعة رد، تغليف، توافر محلي أو متابعة.", "CheckQuestion": "هل الفرصة ممكنة؟", "Origin": "Excel"}, {"TaskID": "MK-A03", "StepNo": 5, "StepTitle": "اختبار مع العملاء", "Instruction": "اعرض الفكرة على 3 عملاء مناسبين واسأل هل تهمهم وما الذي قد يجعلهم يختارونها.", "CheckQuestion": "هل تم تسجيل ردود العملاء؟", "Origin": "Excel"}, {"TaskID": "MK-A04", "StepNo": 1, "StepTitle": "التحضير", "Instruction": "جهز اسم النشاط كما يعرفه العملاء، تصنيفًا مناسبًا، نبذة من جملتين، رقم اتصال، منطقة الخدمة، صورة شعار/منتج وصورة غلاف.", "CheckQuestion": "هل البيانات والصور جاهزة وصحيحة؟", "Origin": "Excel"}, {"TaskID": "MK-A04", "StepNo": 2, "StepTitle": "بدء إنشاء الصفحة", "Instruction": "سجّل الدخول بحساب Facebook شخصي حقيقي لصاحب المشروع (الصفحة تُدار من الحساب الشخصي لكن بياناته لا تظهر عليها). من الكمبيوتر افتح الرابط facebook.com/pages/create أو اضغط Pages/الصفحات من القائمة ثم Create new Page/إنشاء صفحة جديدة. من الموبايل: افتح القائمة Menu ثم Pages/الصفحات ثم Create/إنشاء.", "CheckQuestion": "هل يتم إنشاء صفحة نشاط وليس حسابًا شخصيًا باسم الشركة؟", "Origin": "Excel (محدثة)"}, {"TaskID": "MK-A04", "StepNo": 3, "StepTitle": "إدخال الاسم والتصنيف", "Instruction": "اكتب اسم النشاط الحقيقي، واختر أقرب تصنيف (Category) بكتابة أول حروف نشاطك والاختيار من المقترحات، وأضف نبذة قصيرة (Bio) تجيب: بنقدم إيه؟ لمين؟ وفين؟ ثم اضغط Create Page/إنشاء صفحة.", "CheckQuestion": "هل يفهم زائر جديد طبيعة النشاط؟", "Origin": "Excel (محدثة)"}, {"TaskID": "MK-A04", "StepNo": 4, "StepTitle": "إكمال معلومات النشاط", "Instruction": "أضف الهاتف ووسيلة التواصل والموقع أو منطقة الخدمة وساعات العمل الواقعية. لا تنشر عنوان منزل خاص إذا لا يستقبل العملاء.", "CheckQuestion": "هل يستطيع العميل التواصل والوصول بطريقة صحيحة؟", "Origin": "Excel"}, {"TaskID": "MK-A04", "StepNo": 5, "StepTitle": "إضافة الصور وزر الإجراء", "Instruction": "ارفع صورة ملف واضحة وصورة غلاف حقيقية. اختر زرًا يناسب طريقة الطلب مثل رسالة أو WhatsApp أو اتصال، حسب المتاح.", "CheckQuestion": "هل الصور حقيقية والزر مناسب؟", "Origin": "Excel"}, {"TaskID": "MK-A04", "StepNo": 6, "StepTitle": "النشر والاختبار", "Instruction": "انشر منشورًا ترحيبيًا يوضح المنتجات وطريقة الطلب، ثم افتح الصفحة من حساب/جهاز آخر وجرّب زر التواصل.", "CheckQuestion": "هل الرابط والزر والمنشور يعملون؟", "Origin": "Excel"}, {"TaskID": "MK-A04", "StepNo": 7, "StepTitle": "حفظ الوصول", "Instruction": "احفظ رابط الصفحة، وحدد من l"}, {"TaskID": "MK-A06", "StepNo": 2, "StepTitle": "بدء الإضافة", "Instruction": "افتح business.google.com/add بحساب يملكه المشروع، واختر إضافة نشاط أو المطالبة بملف موجود.", "CheckQuestion": "هل الحساب تحت سيطرة المشروع؟", "Origin": "Excel"}, {"TaskID": "MK-A06", "StepNo": 3, "StepTitle": "إدخال المعلومات", "Instruction": "أدخل اسم النشاط الحقيقي والفئة المناسبة والهاتف وساعات العمل. أدخل العنوان إذا كان موقع استقبال عملاء فعليًا، أو مناطق الخدمة عند انطباقها.", "CheckQuestion": "هل العنوان/المنطقة صحيحة؟", "Origin": "Excel"}, {"TaskID": "MK-A06", "StepNo": 4, "StepTitle": "التحقق", "Instruction": "اختر طريقة التحقق التي يعرضها Google واتبعها. لا تفترض أن وسيلة بعينها ستظهر لكل نشاط.", "CheckQuestion": "هل الحالة مكتملة أم معلقة؟", "Origin": "Excel"}, {"TaskID": "MK-A06", "StepNo": 5, "StepTitle": "إكمال الملف", "Instruction": "أضف وصفًا وصورًا حديثة وراجع الهاتف والساعات والمنطقة. احفظ الرابط وتاريخ التحديث.", "CheckQuestion": "هل المعلومات ظاهرة وصحيحة؟", "Origin": "Excel"}, {"TaskID": "MK-A07", "StepNo": 1, "StepTitle": "استخراج الأسئلة", "Instruction": "راجع آخر 20 محادثة وصنف الأسئلة: سعر، توافر، مقاس/مواصفة، توصيل، دفع، وقت تسليم، استبدال، استخدام.", "CheckQuestion": "هل الأسئلة متكررة فعلًا؟", "Origin": "Excel"}, {"TaskID": "MK-A07", "StepNo": 2, "StepTitle": "كتابة الإجابات", "Instruction": "اكتب لكل سؤال ردًا قصيرًا بمعلومة مؤكدة. إذا كان السعر يتغير، اكتب طريقة التحقق من السعر.", "CheckQuestion": "هل الرد دقيق وحديث؟", "Origin": "Excel"}, {"TaskID": "MK-A07", "StepNo": 3, "StepTitle": "إضافة أسئلة استيضاح", "Instruction": "جهز 3 أسئلة مهمة مثل الكمية والمقاس والمنطقة والموعد، ولا تسأل ما لا يلزم.", "CheckQuestion": "هل تساعد الأسئلة في عرض دقيق؟", "Origin": "Excel"}, {"TaskID": "MK-A07", "StepNo": 4, "StepTitle": "تجربة الردود", "Instruction": "اطلب من شخص اختبار 3 استفسارات، وراجع هل الرد مفهوم ويقود لخطوة تالية.", "CheckQuestion": "هل تمت معالجة أي غموض؟", "Origin": "Excel"}, {"TaskID": "MK-A07", "StepNo": 5, "StepTitle": "تحديث النسخة", "Instruction": ckQuestion": "هل أُضيف الاستفسار اليوم؟"}, {"RoutineID": "R-MK01", "StepNo": 3, "StepTitle": "تحديث الحالة", "Instruction": "اختر: جديد، تم الرد، يحتاج متابعة، تم البيع، لم يشترِ. اكتب سبب عدم الشراء إذا عُرف.", "CheckQuestion": "هل لكل استفسار حالة حالية؟"}, {"RoutineID": "R-MK01", "StepNo": 4, "StepTitle": "تحديد الخطوة التالية", "Instruction": "إذا كان يحتاج متابعة، حدد من سيتواصل ومتى وما المعلومة المطلوبة.", "CheckQuestion": "هل هناك موعد ومسؤول واضحان؟"}, {"RoutineID": "R-MK02", "StepNo": 1, "StepTitle": "إنشاء أعمدة", "Instruction": "اكتب: التاريخ، رقم الطلب، المنتج، الكمية، إجمالي القيمة، الخصم/المرتجع إن وجد، قناة البيع، حالة التحصيل.", "CheckQuestion": "هل الحقول كافية دون تعقيد؟"}, {"RoutineID": "R-MK02", "StepNo": 2, "StepTitle": "تسجيل البيع", "Instruction": "بعد تأكيد البيع سجل البيانات من الطلب أو الإيصال. سجل الإلغاء والمرتجع منفصلًا ولا تحذف السجل القديم.", "CheckQuestion": "هل يمكن تتبع كل عملية؟"}, {"RoutineID": "R-MK02", "StepNo": 3, "StepTitle": "تحديد القناة", "Instruction": "استخدم اختيارات ثابتة مثل محل، Facebook، WhatsApp، موزع، سوق، ترشيح عميل.", "CheckQuestion": "هل مصدر البيع معلوم؟"}, {"RoutineID": "R-MK02", "StepNo": 4, "StepTitle": "إجمالي اليوم", "Instruction": "اجمع قيمة المبيعات المكتملة حسب الاتفاق، وافصل النقد المحصل عن البيع الآجل.", "CheckQuestion": "هل إجمالي المبيعات لا يُخلط بالمقبوضات؟"}, {"RoutineID": "R-MK03", "StepNo": 1, "StepTitle": "تصفية القائمة", "Instruction": "افتح العملاء بحالة يحتاج متابعة وحدد من لم يسبق رفضه للتواصل ومن توجد له خطوة تالية مناسبة.", "CheckQuestion": "هل القائمة تضم فرصًا حقيقية فقط؟"}, {"RoutineID": "R-MK03", "StepNo": 2, "StepTitle": "تجهيز سبب التواصل", "Instruction": "راجع المحادثة واعرف السؤال أو العرض الذي يحتاج العميل إجابة عنه؛ لا ترسل رسالة عامة بلا سياق.", "CheckQuestion": "هل الرسالة مرتبطة باحتياج العميل؟"}, {"RoutineID": "R-MK03", "StepNo": 3, "StepTitle": "إرسال متابعة مناسبة", "Instruction": "أرسل رسالة مهذبة قصيرة في وقت مناسب، مثل توضيح المقاس أو تأكيد التوافر أو سؤال هل يحتاج معلومات إضافية.", "CheckQuestion": "هل الرسالة غير ضاغطة؟"}, {"RoutineID": "R-MK03", "StepNo": 4, "StepTitle": "تسجيل النتيجة", "Instruction": "سجل: رد/لم يرد/اشترى/اعتذر/طلب عدم التواصل، وحدد موعدًا جديدًا فقط عند وجود مبرر.", "CheckQuestion": "هل تم احترام طلب العميل وتحديث السجل؟"}, {"RoutineID": "R-MK04", "StepNo": 1, "StepTitle": "تحديد الفترة", "Instruction": "اكتب تاريخ بداية ونهاية الأسبوع وحدد هل التقرير مبني على طلبات مكتملة أم على المقبوضات.", "CheckQuestion": "هل الفترة وتعريف البيع واضحان؟"}, {"RoutineID": "R-MK04", "StepNo": 2, "StepTitle": "تلخيص المنتجات", "Instruction": "اجمع عدد الوحدات وقيمة المبيعات لكل منتج/خدمة، وحدد أعلى الأصناف وأضعفها.", "CheckQuestion": "هل لا تختلط الوحدات المختلفة؟"}, {"RoutineID": "R-MK04", "StepNo": 3, "StepTitle": "تلخيص القنوات", "Instruction": "اجمع عدد الاستفسارات والطلبات والمبيعات لكل قناة متاحة، مع توضيح نقص البيانات إن وجد.", "CheckQuestion": "هل القناة مسجلة من واقع السجل؟"}, {"RoutineID": "R-MK04", "StepNo": 4, "StepTitle": "اختيار قرار", "Instruction": "اكتب ملاحظة واحدة قابلة للتنفيذ: تحسين عرض منتج، تجربة قناة، أو وقف جهد لا ينتج فرصًا، وحدد مسؤولًا وموعدًا.", "CheckQuestion": "هل القرار مرتبط بالبيانات؟"}, {"RoutineID": "R-MK05", "StepNo": 1, "StepTitle": "اختيار موعد مناسب", "Instruction": "حدد متى يكون العميل قد استلم وجرب المنتج؛ للخدمات حدد بعد اكتمال الخدمة أو ظهور نتيجتها.", "CheckQuestion": "هل المتابعة جاءت بعد فرصة فعلية للتقييم؟"}, {"RoutineID": "R-MK05", "StepNo": 2, "StepTitle": "إرسال سؤال مختصر", "Instruction": "اسأل: هل وصل/تمت الخدمة كما اتفقنا؟ هل هناك شيء يحتاج تعديلًا؟ لا تطلب تقييمًا إيجابيًا فقط.", "CheckQuestion": "هل السؤال يسمح برأي صريح؟"}, {"RoutineID": "R-MK05", "StepNo": 3, "StepTitle": "تسجيل الملاحظات", "Instruction": "صنف الملاحظة: جودة، مقاس، تأخير، تغليف، تواصل، أو غير ذلك؛ لا تنشر بيانات العميل دون إذنه.", "CheckQuestion": "هل الملاحظة مسجلة دون إفشاء خصوصية؟"}, {"RoutineID": "R-MK05", "StepNo": 4, "StepTitle": "إغلاق الحلقة", "Instruction": "حدد إجراءً ومسؤولًا وموعدًا للشكاوى، وأبلغ العميل بما يمكن فعله واقعيًا.", "CheckQuestion": "هل تم الرد على الشكوى أو تحديد موعد؟"}, {"RoutineID": "R-MK06", "StepNo": 1, "StepTitle": "حصر أماكن العرض", "Instruction": "راجع صفحة Facebook وكتالوج WhatsApp والمنشورات المثبتة وقوائم الأسعار التي يرسلها المشروع.", "CheckQuestion": "هل تمت مراجعة كل القنوات المستخدمة؟"}, {"RoutineID": "R-MK06", "StepNo": 2, "StepTitle": "مطابقة الواقع", "Instruction": "تحقق من السعر والمقاس واللون والمكونات والتوافر ووقت التسليم من الشخص المسؤول عن التشغيل.", "CheckQuestion": "هل المعلومات مؤكدة؟"}, {"RoutineID": "R-MK06", "StepNo": 3, "StepTitle": "تحديث أو إيقاف", "Instruction": "عدّل المعلومات أو أخفِ العرض غير المتاح، ولا تترك سعرًا قديمًا بلا تنبيه.", "CheckQuestion": "هل أزيلت المعلومات المضللة؟"}, {"RoutineID": "R-MK06", "StepNo": 4, "StepTitle": "تسجيل المراجعة", "Instruction": "اكتب التاريخ والشخص الذي راجع وأي تغيير تم.", "CheckQuestion": "هل يوجد تاريخ مراجعة واضح؟"}, {"RoutineID": "R-FN01", "StepNo": 1, "StepTitle": "فتح سجل موحد", "Instruction": "خصص صفحة أو جدولًا للإيرادات والتحصيلات ولا تكتبها في أماكن متفرقة.", "CheckQuestion": "هل يوجد مكان واحد؟"}, {"RoutineID": "R-FN01", "StepNo": 2, "StepTitle": "تسجيل كل قبض", "Instruction": "اكتب التاريخ والبيان والمبلغ وطريقة القبض والطرف ورقم الإثبات إن وجد.", "CheckQuestion": "هل كل قبض له تاريخ وسبب؟"}, {"RoutineID": "R-FN01", "StepNo": 3, "StepTitle": "تصنيف القبض", "Instruction": "حدد هل هو بيع نقدي، تحصيل مديونية قديمة، تمويل/إضافة مالك، أو مصدر آخر؛ لا تعتبر التمويل مبيعات.", "CheckQuestion": "هل نوع المال واضح؟"}, {"RoutineID": "R-FN01", "StepNo": 4, "StepTitle": "حفظ الإثبات", "Instruction": "احتفظ بالإيصال/رسالة التحويل واربطه برقم العملية، مع حماية بيانات الحساب.", "CheckQuestion": "هل يمكن الرجوع للإثبات؟"}, {"RoutineID": "R-FN02", "StepNo": 1, "StepTitle": "تحديد التصنيفات", "Instruction": "ابدأ بتصنيفات قليلة مفهومة: خامات، أجور، نقل، إيجار، كهرباء، تعبئة، صيانة، تسويق، أخرى.", "CheckQuestion": "هل التصنيفات مناسبة للنشاط؟"}, {"RoutineID": "R-FN02", "StepNo": 2, "StepTitle": "تسجيل المصروف", "Instruction": "اكتب كل مبلغ عند دفعه مع التاريخ والمورد والغرض والمبلغ وطريقة الدفع.", "CheckQuestion": "هل وصف المصروف محدد؟"}, {"RoutineID": "R-FN02", "StepNo": 3, "StepTitle": "تمييز غير التشغيلي", "Instruction": "سجل سحب صاحب المشروع أو شراء شخصي منفصلًا ولا تضعه ضمن مصروفات التشغيل.", "CheckQuestion": "هل تم الفصل؟"}, {"RoutineID": "R-FN02", "StepNo": 4, "StepTitle": "إرفاق الإثبات", "Instruction": "اربط رقم الإيصال بالسجل أو اكتب سبب عدم وجود مستند.", "CheckQuestion": "هل يوجد مرجع للمراجعة؟"}, {"RoutineID": "R-FN03", "StepNo": 1, "StepTitle": "حساب الرصيد المتوقع", "Instruction": "رصيد أول اليوم + المقبوضات - المدفوعات - السحوبات المسجلة = الرصيد المتوقع.", "CheckQuestion": "هل كل عناصر المعادلة مسجلة؟"}, {"RoutineID": "R-FN03", "StepNo": 2, "StepTitle": "عد الرصيد الفعلي", "Instruction": "عد النقد الموجود، وراجع رصيد المحافظ أو التحويلات التي تخص المشروع.", "CheckQuestion": "هل العد في نفس وقت الإغلاق؟"}, {"RoutineID": "R-FN03", "StepNo": 3, "StepTitle": "حساب الفرق", "Instruction": "اطرح الفعلي من المتوقع وسجل قيمة الفرق كما هي.", "CheckQuestion": "هل تم تسجيل الفرق لا إخفاؤه؟"}, {"RoutineID": "R-FN03", "StepNo": 4, "StepTitle": "البحث عن السبب", "Instruction": "راجع العمليات والإيصالات والأخطاء المحتملة؛ إذا لم تعرف السبب، اكتب (فرق غير مفسر) واطلب مراجعة.", "CheckQuestion": "هل السبب مدعوم أم ما زال فرضية؟"}, {"RoutineID": "R-FN04", "StepNo": 1, "StepTitle": "فتح الأسابيع", "Instruction": "اكتب الرصيد المتاح اليوم وأربعة أسابيع متتابعة في أعمدة أو صفوف.", "CheckQuestion": "هل تاريخ البداية والرصيد فعليان؟"}, {"RoutineID": "R-FN04", "StepNo": 2, "StepTitle": "إدخال المقبوضات", "Instruction": "سجل التحصيل المتوقع وتاريخه ومصدره ودرجة تأكده؛ لا تضع كامل الفاتورة في أسبوع غير متوقع تحصيلها.", "CheckQuestion": "هل تاريخ القبض واقعي؟"}, {"RoutineID": "R-FN04", "StepNo": 3, "StepTitle": "إدخال المدفوعات", "Instruction": "سجل موعد الأجور والإيجار والموردين والأقساط والشراء والصيانة، حتى لو كانت غير أسبوعية.", "CheckQuestion": "هل أدرجت الالتزامات الكبيرة؟"}, {"RoutineID": "R-FN04", "StepNo": 4, "StepTitle": "تحديد أسبوع الخطر", "Instruction": "احسب رصيد نهاية كل أسبوع وحدد العجز المحتمل وخيارًا ممكنًا مع المنتور.", "CheckQuestion": "هل هناك إجراء قبل حدوث العجز؟"}, {"RoutineID": "R-FN04", "StepNo": 5, "StepTitle": "مقارنة الفعلي", "Instruction": "في المراجعة التالية أدخل المقبوض والمدفوع الفعليين وعدّل بقية الأسابيع.", "CheckQuestion": "هل التوقع يتعلم من الفروق؟"}, {"RoutineID": "R-FN05", "StepNo": 1, "StepTitle": "تجميع المبالغ", "Instruction": "افصل مستحقات العملاء عن التزامات الموردين، وسجل الطرف والمرجع والمبلغ الأصلي والمدفوع والمتبقي.", "CheckQuestion": "هل الطرف ونوع المستحق واضحان؟"}, {"RoutineID": "R-FN05", "StepNo": 2, "StepTitle": "تحديد الموعد", "Instruction": "اكتب تاريخ الاستحقاق أو تاريخ المتابعة المتفق عليه، لا تخمن تاريخًا.", "CheckQuestion": "هل التاريخ متفق عليه؟"}, {"RoutineID": "R-FN05", "StepNo": 3, "StepTitle": "المراجعة والتواصل", "Instruction": "راجع المبالغ المستحقة فقط وتواصل باحترام لتأكيد موعد السداد أو معالجة اختلاف.", "CheckQuestion": "هل التواصل موثق ومحترم؟"}, {"RoutineID": "R-FN05", "StepNo": 4, "StepTitle": "تحديث الرصيد", "Instruction": "سجل أي دفعة جزئية أو تعديل متفق عليه واحتفظ بالإثبات.", "CheckQuestion": "هل الرصيد المتبقي صحيح؟"}, {"RoutineID": "R-FN06", "StepNo": 1, "StepTitle": "اختيار المنتجات", "Instruction": "ابدأ بأعلى 3 منتجات مبيعًا أو الأكثر تأثيرًا على الربح.", "CheckQuestion": "هل الاختيار مرتبط بالمبيعات أو الأهمية؟"}, {"RoutineID": "R-FN06", "StepNo": 2, "StepTitle": "تحديث التكلفة", "Instruction": "راجع كمية وسعر الخامات والعمل والتعبئة والنقل والعمولات والهالك الفعلي.", "CheckQuestion": "هل البيانات بتاريخ حديث؟"}, {"RoutineID": "R-FN06", "StepNo": 3, "StepTitle": "مراجعة السعر", "Instruction": "قارن سعر البيع الحالي بتكلفة الوحدة وبأسعار بدائل مشابهة مع مراعاة اختلاف الجودة والمواصفات.", "CheckQuestion": "هل المقارنة عادلة؟"}, {"RoutineID": "R-FN06", "StepNo": 4, "StepTitle": "تسجيل القرار", "Instruction": "اكتب إبقاء السعر أو تعديله أو إجراء اختبار محدود، وحدد تاريخ المراجعة التالية.", "CheckQuestion": "هل القرار وسببه موثقان؟"}, {"RoutineID": "R-OP01", "StepNo": 1, "StepTitle": "إنشاء قائمة الطلبات", "Instruction": "سجل رقم الطلب وتاريخه والكمية والوعد بالتسليم والمرحلة الحالية والمسؤول.", "CheckQuestion": "هل لكل طلب رقم يسهل الرجوع إليه؟"}, {"RoutineID": "R-OP01", "StepNo": 2, "StepTitle": "تحديث الحالة", "Instruction": "استخدم حالات قليلة: جديد، تحت التنفيذ، فحص، جاهز، تم التسليم، متوقف.", "CheckQuestion": "هل الحالة تعكس الواقع اليوم؟"}, {"RoutineID": "R-OP01", "StepNo": 3, "StepTitle": "إظهار العائق", "Instruction": "إذا توقف الطلب، اكتب السبب والموعد المتوقع والخطوة المطلوبة ومن سينفذها.", "CheckQuestion": "هل يوجد إجراء لا مجرد عبارة متوقف؟"}, {"RoutineID": "R-OP01", "StepNo": 4, "StepTitle": "مراجعة التسليمات", "Instruction": "في بداية اليوم راجع الطلبات المستحقة خلال الأيام المقبلة ورتب الأولوية.", "CheckQuestion": "هل اكتشف التأخير قبل موعد العميل؟"}, {"RoutineID": "R-OP02", "StepNo": 1, "StepTitle": "تحديد الدفعة", "Instruction": "اكتب رمز المنتج/الدفعة وتاريخ البداية والنهاية ووحدة القياس.", "CheckQuestion": "هل يمكن تمييز الدفعة عن غيرها؟"}, {"RoutineID": "R-OP02", "StepNo": 2, "StepTitle": "تسجيل المخطط والفعلي", "Instruction": "اكتب الكمية المخططة والكمية التي اكتملت فعليًا والكمية السليمة.", "CheckQuestion": "هل لا تعتمد على التقدير بعد أيام؟"}, {"RoutineID": "R-OP02", "StepNo": 3, "StepTitle": "تسجيل الفاقد", "Instruction": "اكتب عدد المعيب أو الهالك أو المعاد تشغيله وسببًا أوليًا إذا عُرف.", "CheckQuestion": "هل تم تسجيل الكمية والسبب دون لوم؟"}, {"RoutineID": "R-OP02", "StepNo": 4, "StepTitle": "مراجعة الفرق", "Instruction": "قارن المخطط بالفعلي وحدد إن كان السبب خامة أو وقتًا أو عطلًا أو طلبًا متغيرًا.", "CheckQuestion": "هل تم تحديد إجراء عند وجود انحراف؟"}, {"RoutineID": "R-OP03", "StepNo": 1, "StepTitle": "اختيار الأصناف", "Instruction": "اختر الخامات التي قد توقف الإنتاج أو مرتفعة القيمة، وحدد وحدة قياس واحدة ومكان تخزين.", "CheckQuestion": "هل الأصناف المختارة ذات أولوية؟"}, {"RoutineID": "R-OP03", "StepNo": 2, "StepTitle": "تسجيل الرصيد", "Instruction": "ابدأ بجرد فعلي وسجل الرصيد الافتتاحي وتاريخه.", "CheckQuestion": "هل الرصيد ليس تقديرًا؟"}, {"RoutineID": "R-OP03", "StepNo": 3, "StepTitle": "تسجيل الوارد والصرف", "Instruction": "اكتب كل استلام وكمية واردة وكل صرف وسبب الاستخدام والطلب المرتبط.", "CheckQuestion": "هل كل حركة لها مستند أو سبب؟"}, {"RoutineID": "R-OP03", "StepNo": 4, "StepTitle": "مطابقة أسبوعية", "Instruction": "عد الأصناف المختارة وقارنها بالرصيد الدفتري وسجل الفرق وراجع آخر الحركات.", "CheckQuestion": "هل تم التحقيق في الفروق؟"}, {"RoutineID": "R-OP04", "StepNo": 1, "StepTitle": "تجميع الطلبات", "Instruction": "اكتب الطلبات المؤكدة وموعد التسليم والكمية والأولوية؛ ضع التوقعات في خانة منفصلة.", "CheckQuestion": "هل المؤكد منفصل عن المتوقع؟"}, {"RoutineID": "R-OP04", "StepNo": 2, "StepTitle": "تقدير الطاقة", "Instruction": "راجع زمن العمليات وتوافر العاملين والمعدات والخامات قبل قبول حجم الإنتاج.", "CheckQuestion": "هل الخطة ضمن قدرة المشروع؟"}, {"RoutineID": "R-OP04", "StepNo": 3, "StepTitle": "توزيع العمل", "Instruction": "حدد ما سيتم كل يوم ومن المسؤول وموعد بدء/انتهاء كل مرحلة.", "CheckQuestion": "هل كل مرحلة لها مسؤول؟"}, {"RoutineID": "R-OP04", "StepNo": 4, "StepTitle": "مراجعة منتصف الأسبوع", "Instruction": "قارن الإنجاز بالخطة وأعد الترتيب عند التأخير مع إبلاغ العميل بموعد واقعي عند اللزوم.", "CheckQuestion": "هل يتم تحديث الخطة عند تغير الواقع؟"}, {"RoutineID": "R-OP05", "StepNo": 1, "StepTitle": "تحديد نقطة الفحص", "Instruction": "حدد المرحلة التي يمكن عندها اكتشاف العيب مبكرًا، قبل أن يصعب إصلاحه.", "CheckQuestion": "هل الفحص يحدث في الوقت المناسب؟"}, {"RoutineID": "R-OP05", "StepNo": 2, "StepTitle": "استخدام معيار واضح", "Instruction": "راجع المقاس أو الوزن أو اللون أو المكونات أو سلامة التعبئة بحسب المنتج.", "CheckQuestion": "هل معيار القبول مكتوب؟"}, {"RoutineID": "R-OP05", "StepNo": 3, "StepTitle": "تسجيل النتيجة", "Instruction": "سجل عدد المفحوص والمقبول والعيوب ونوعها والدفعة.", "CheckQuestion": "هل الأرقام واضحة؟"}, {"RoutineID": "R-OP05", "StepNo": 4, "StepTitle": "التعامل مع غير المطابق", "Instruction": "اعزل المنتج أو أوقف انتقاله، وحدد إصلاحًا أو إعادة عمل أو استبعادًا وفق تعليمات آمنة.", "CheckQuestion": "هل منع انتقال العيب؟"}, {"RoutineID": "R-OP06", "StepNo": 1, "StepTitle": "مراجعة التعليمات", "Instruction": "حدد من دليل المعدة ما يجب فحصه قبل الاستخدام وما العلامات التي تستلزم التوقف.", "CheckQuestion": "هل الفحص مصدره تعليمات موثوقة؟"}, {"RoutineID": "R-OP06", "StepNo": 2, "StepTitle": "تنفيذ الفحص المسموح", "Instruction": "نفذ الفحص الخارجي/التشغيلي المسموح فقط دون فك أجزاء أو تجاوز وسائل الحماية.", "CheckQuestion": "هل الفحص آمن؟"}, {"RoutineID": "R-OP06", "StepNo": 3, "StepTitle": "تسجيل النتيجة", "Instruction": "اكتب التاريخ واسم المشغل والنتيجة وأي صوت أو اهتزاز أو تسريب غير معتاد.", "CheckQuestion": "هل تم تسجيل الحالة؟"}, {"RoutineID": "R-OP06", "StepNo": 4, "StepTitle": "التصعيد عند الخطر", "Instruction": "أوقف المعدة إذا وُجد خطر واضح واتصل بفني مؤهل، ولا تحاول إصلاحًا خارج صلاحيتك.", "CheckQuestion": "هل تم الإبلاغ عن الخطر؟"}, {"RoutineID": "R-MK07", "StepNo": 1, "StepTitle": "حدد اليومين", "Instruction": "اختار يومين ثابتين في الأسبوع (مثلًا الأحد والأربعاء) ووقت بيكون فيه العملاء فاضيين.", "CheckQuestion": "هل الأيام ثابتة؟"}, {"RoutineID": "R-MK07", "StepNo": 2, "StepTitle": "جهّز المحتوى", "Instruction": "صورة حقيقية أو فيديو قصير + اسم المنتج + السعر + ميزة واحدة + رقم أو طريقة الطلب.", "CheckQuestion": "هل المنشور فيه سعر وطريقة طلب؟"}, {"RoutineID": "R-MK07", "StepNo": 3, "StepTitle": "انشر ورد", "Instruction": "انشر في الميعاد، ورد على الرسائل والتعليقات في نفس اليوم.", "CheckQuestion": "هل الرد اتعمل؟"}, {"RoutineID": "R-MK07", "StepNo": 4, "StepTitle": "سجّل النتيجة", "Instruction": "اكتب جنب كل منشور عدد الرسائل اللي جت منه، وكل أسبوعين قارن.", "CheckQuestion": "هل النتيجة متسجلة؟"}, {"RoutineID": "R-MK08", "StepNo": 1, "StepTitle": "اجمع الإجمالي", "Instruction": "اجمع قيمة مبيعات الشهر وعدد الطلبات، واقسم المبيعات على الطلبات تعرف متوسط الطلب.", "CheckQuestion": "هل الأرقام من السجل؟"}, {"RoutineID": "R-MK08", "StepNo": 2, "StepTitle": "رتّب المنتجات", "Instruction": "اكتب أعلى 5 وأقل 5 منتجات مبيعًا.", "CheckQuestion": "هل الترتيب صحيح؟"}, {"RoutineID": "R-MK08", "StepNo": 3, "StepTitle": "العملاء", "Instruction": "من قائمة العملاء عد الجدد والمتكررين خلال الشهر.", "CheckQuestion": "هل التصنيف محدث؟"}, {"RoutineID": "R-MK08", "StepNo": 4, "StepTitle": "قارن واكتب ملاحظة", "Instruction": "قارن بالشهر اللي فات واكتب ملاحظة واحدة وقرار واحد.", "CheckQuestion": "هل فيه قرار عملي؟"}, {"RoutineID": "R-FN07", "StepNo": 1, "StepTitle": "اجمع الداخل", "Instruction": "اجمع كل الإيرادات والتحصيلات المسجلة خلال الأسبوع.", "CheckQuestion": "هل كل الأيام متسجلة؟"}, {"RoutineID": "R-FN07", "StepNo": 2, "StepTitle": "اجمع الخارج", "Instruction": "اجمع مصروفات المشروع، وسجّل سحوبات المالك في سطر لوحدها.", "CheckQuestion": "هل السحب منفصل؟"}, {"RoutineID": "R-FN07", "StepNo": 3, "StepTitle": "احسب الصافي والرصيد", "Instruction": "الصافي = الداخل - مصروفات المشروع. الرصيد = رصيد أول الأسبوع + الداخل - كل الخارج والسحب.", "CheckQuestion": "هل الحساب صحيح؟"}, {"RoutineID": "R-FN07", "StepNo": 4, "StepTitle": "قارن بالموجود", "Instruction": "قارن الرصيد المحسوب بالفلوس الموجودة فعلًا واكتب الفرق وسببه.", "CheckQuestion": "هل الفرق مفسر؟"}, {"RoutineID": "R-FN08", "StepNo": 1, "StepTitle": "المبيعات", "Instruction": "اجمع مبيعات الشهر من دفتر المبيعات (مش التحصيل بس).", "CheckQuestion": "هل المبيعات منفصلة عن التمويل؟"}, {"RoutineID": "R-FN08", "StepNo": 2, "StepTitle": "التكلفة والمصروفات", "Instruction": "اجمع تكلفة الخامات المستخدمة أو البضاعة المباعة، وباقي المصروفات حسب التصنيف.", "CheckQuestion": "هل المخزون المتبقي متحسب صح؟"}, {"RoutineID": "R-FN08", "StepNo": 3, "StepTitle": "الربح التقديري", "Instruction": "الربح = المبيعات - تكلفة ما بيع - المصروفات. اكتب أي بند ناقص.", "CheckQuestion": "هل الأرقام لها مصدر؟"}, {"RoutineID": "R-FN08", "StepNo": 4, "StepTitle": "السحب والرصيد", " function call(fn){ var args=[].slice.call(arguments,1);

    else if(window.LocalAPI){ setTimeout(function(){ try{ done(window.LocalAPI(fn,args)); }catch(e){ rej(e);} },60); }
