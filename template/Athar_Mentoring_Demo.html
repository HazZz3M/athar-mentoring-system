  if(D.ProblemID){var p=L.problem[D.ProblemID];h+='<div class="card"><h3>'+esc(p.ProblemName)+' <span class="tag">'+esc(p.ProblemID)+'</span></h3>'+
    '<div class="kv"><b>الأعراض:</b> '+esc(p.Symptoms)+'</div><div class="kv"><b>أسئلة التشخيص (اسألها لصاحب المشروع):</b></div><ul class="steps">'+String(p.DiagnosticQuestions).split('؟').map(function(q){return q.trim()}).filter(Boolean).map(function(q){return '<li>'+esc(q)+'؟</li>'}).join('')+'</ul>'+
    '<div class="kv"><b>أمثلة:</b> '+esc(p.BusinessExamples)+'</div><div class="kv"><b>مؤشرات مرتبطة:</b> '+ids(p.KPIIDs).map(function(k){return '<span class="tag gray">'+esc((L.kpi[k]||{}).KPIName)+'</span>'}).join('')+'</div>'+
    '<h4>الخطوة 4–6: الأسباب المحتملة — صنّف كل سبب</h4>'+L.LIB_Causes.filter(function(c){return c.ProblemID===D.ProblemID}).map(function(c){var P='diagnosis|causes|'+c.CauseID+'|';var cl=(D.causes[c.CauseID]||{}).Classification;
      return '<div class="card flat" style="padding:8px 10px;margin:6px 0"><div class="row"><b class="grow">'+esc(c.CauseText)+'</b>'+chips(P+'Classification',['مؤكد بدليل','مرجح ويحتاج تحقق','غير منطبق'],function(o){return o==='مؤكد بدليل'?'ok':o==='مرجح ويحتاج تحقق'?'warn':''})+'</div><div class="sm mut">كيف تتحقق: '+esc(c.HowToVerify)+'</div>'+(cl&&cl!=='غير منطبق'?inp(P+'EvidenceNote','text','الدليل أو الملاحظة التي تدعم التصنيف'):'')+'</div>'}).join('')+'</div>';}
  return h;}

/* ---- step 5: strategy */
function st5(){var d=S.d,L=S.L,D=d.diagnosis,St=d.strategy;if(!D.ProblemID)return '<div class="card box warn">اختر المشكلة في خطوة التشخيص أولًا.</div>';
  var sel=Object.keys(D.causes).filter(function(k){var c=D.causes[k].Classification;return c==='مؤكد بدليل'||c==='مرجح ويحتاج تحقق'});
  var list=ids(L.problem[D.ProblemID].StrategyIDs).map(function(sid){var s=L.strategy[sid];var m=ids(s.CauseIDs).filter(function(c){return sel.indexOf(c)>=0});return {s:s,m:m}}).sort(function(a,b){return b.m.length-a.m.length});
  var h='<div class="card"><h3>5. اختر الاستراتيجية الأساسية</h3><div class="sm mut">الاستراتيجيات مرتبة حسب عدد الأسباب المختارة التي تعالجها. النظام يقترح ولا يفرض.</div></div>';
  list.forEach(function(x){var s=x.s;var on=St.PrimaryStrategyID===s.StrategyID;h+='<div class="card '+(on?'sel':'')+'"><div class="row"><span class="chip '+(on?'on':'')+'" data-act="pickStrategy" data-v="'+s.StrategyID+'">'+(on?'✓ الأساسية':'اختيار كأساسية')+'</span><b class="grow">'+esc(s.StrategyName)+'</b>'+(x.m.length?'<span class="tag ok">تعالج '+x.m.length+' من الأسباب المختارة</span>':'<span class="tag gray">لا تطابق الأسباب المختارة</span>')+'</div>'+
    '<div class="grid g2" style="margin-top:6px"><div><div class="kv"><b>ماذا تحقق:</b> '+esc(s.Aim)+'</div><div class="kv"><b>الأسباب التي تعالجها:</b> '+ids(s.CauseIDs).map(function(c){return '<span class="tag '+(x.m.indexOf(c)>=0?'ok':'gray')+'">'+esc((L.cause[c]||{}).CauseText)+'</span>'}).join('')+'</div><div class="kv"><b>النتائج المتوقعة:</b> '+esc(s.ExpectedResults)+'</div></div>'+
    '<div><div class="kv"><b>متى تناسب:</b> '+esc(s.WhenFit)+'</div><div class="kv"><b>متى لا تناسب:</b> '+esc(s.WhenNotFit)+'</div><div class="kv"><b>مؤشرات النجاح:</b> '+ids(s.SuccessKPIIDs).map(function(k){return esc((L.kpi[k]||{}).KPIName)}).join('، ')+'</div><div class="kv"><b>المهام المتاحة:</b> '+ids(s.TaskIDs).length+' | <b>روتينات:</b> '+ids(s.RoutineIDs).map(function(r){return esc((L.routine[r]||{}).RoutineName)}).join('، ')+'</div></div></div></div>';});
  var others=L.LIB_Strategies.filter(function(s){return s.StrategyID!==St.PrimaryStrategyID});
  h+='<div class="card"><h4>استراتيجية مساندة (اختيارية — فقط عند وجود مبرر)</h4><select data-bind="strategy|SupportingStrategyID"><option value="">بدون</option>'+L.LIB_Areas.map(function(a){return '<optgroup label="'+esc(a.AreaName)+'">'+others.filter(function(s){return s.AreaID===a.AreaID}).map(function(s){return '<option value="'+s.StrategyID+'"'+(St.SupportingStrategyID===s.StrategyID?' selected':'')+'>'+esc(s.StrategyName)+' — '+esc((L.problem[s.ProblemID]||{}).ProblemName)+'</option>'}).join('')+'</optgroup>'}).join('')+'</select>'+
    (St.SupportingStrategyID?'<label class="f req">مبرر الاستراتيجية المساندة</label>'+inp('strategy|SupportJustification'):'')+'</div>';
  return h;}

/* ---- step 6: new tasks */
function openByTask(){var m={};S.ctx.openAssignments.forEach(function(a){var r=S.d.reviews[a.AssignmentID];if(['تم الإنجاز','إلغاء لعدم الملاءمة','تقسيم لمهام أصغر'].indexOf(r.Decision)<0)m[a.TaskID]=a});return m;}
function chosenStrats(){var s=S.d.strategy;return [s.PrimaryStrategyID,s.SupportingStrategyID].filter(Boolean);}
function st6(){var d=S.d,L=S.L,cs=chosenStrats();if(!cs.length)return '<div class="card box warn">اختر الاستراتيجية أولًا.</div>';
  var open=openByTask(),done={};S.ctx.journey.assignments.forEach(function(a){if(a.CurrentDecision==='تم الإنجاز')done[a.TaskID]=a});var added={};d.newTasks.forEach(function(t){added[t.TaskID]=t});
  var tasks=[];cs.forEach(function(sid){ids(L.strategy[sid].TaskIDs).forEach(function(t){if(tasks.indexOf(t)<0)tasks.push(t)})});
  var lim=S.boot.constants.newTasksSoftLimit;var h='<div class="card"><div class="row"><h3 class="grow" style="margin:0">6. اختر المهام الجديدة</h3><span class="tag '+(d.newTasks.length>lim?'bad':'ok')+'">مختارة: '+d.newTasks.length+'</span></div><div class="sm mut">ابدأ عادةً بـ2–3 مهام جديدة في الأسبوع بالإضافة للمهام المستمرة والروتينات. افتح التعليمات قبل الإسناد.</div>'+(d.newTasks.length>lim?'<div class="box warn sm">عدد المهام أكبر من المعتاد — تأكد من قدرة صاحب المشروع.</div>':'')+'</div>';
  if(d.newTasks.length){h+='<div class="card"><h4>المهام المضافة للخطة — خصّصها</h4>'+d.newTasks.map(function(t,i){var a=L.action[t.TaskID]||{};var P='newTasks|'+i+'|';var off=t.TaskID==='CUSTOM'||!ids(a.StrategyIDs).some(function(x){return cs.indexOf(x)>=0});
    return '<div class="card flat" style="padding:8px 10px"><div class="row"><b class="grow">'+esc(t.TaskID==='CUSTOM'?t.TaskName||'مهمة مخصصة':a.TaskName)+'</b>'+(off?'<span class="tag warn">من خارج الاستراتيجية</span>':'')+'<button class="btn sm danger" data-act="delTask" data-i="'+i+'">إزالة</button></div>'+
    (t.TaskID==='CUSTOM'?'<div class="grid g2"><div><label class="f req">اسم المهمة</label>'+inp(P+'TaskName')+'</div><div><label class="f">المخرج المطلوب</label>'+inp(P+'Deliverable')+'</div></div><label class="f req">خطوات التنفيذ (سطر لكل خطوة)</label>'+ta(P+'CustomInstructions'):'')+
    '<div class="grid g4"><div><label class="f req">آخر موعد</label>'+inp(P+'Deadline','date')+'</div><div><label class="f">المسؤول</label>'+inp(P+'Responsible','text',a.Responsible||'')+'</div><div><label class="f">الرقم المستهدف</label>'+inp(P+'TargetNote','text','مثال: 10 عملاء')+'</div><div><label class="f">النتيجة المتوقعة</label>'+inp(P+'ExpectedResult','text',a.OutcomeIndicator||'')+'</div></div>'+
    (t.TaskID!=='CUSTOM'?'<label class="f">تخصيص/تبسيط للمشروع</label>'+inp(P+'CustomInstructions','text','مثال: ابدئي بالعباية الأكثر طلبًا'):'')+(off?'<label class="f req">مبرر الإسناد من خارج الاستراتيجية</label>'+inp(P+'OffStrategyReason'):'')+'</div>'}).join('')+'</div>';}
  h+='<h4>مهام الاستراتيجية المختارة ('+tasks.length+')</h4><div class="grid g2">'+tasks.map(function(tid){return taskCard(tid,open[tid],done[tid],added[tid])}).join('')+'</div>';
  h+='<div class="card"><h4>مهمة من خارج الاستراتيجية أو مهمة مخصصة</h4><div class="row"><select id="extraTask" class="grow" style="width:auto"><option value="">اختر مهمة من المكتبة…</option>'+L.LIB_Areas.map(function(a){return '<optgroup label="'+esc(a.AreaName)+'">'+L.LIB_Actions.filter(function(x){return x.AreaID===a.AreaID&&tasks.indexOf(x.TaskID)<0}).map(function(x){return '<option value="'+x.TaskID+'">'+esc(x.TaskID+' — '+x.TaskName)+'</option>'}).join('')+'</optgroup>'}).join('')+'</select><button class="btn sm sec" data-act="addExtra">إضافة</button><button class="btn sm sec" data-act="addCustom">+ مهمة مخصصة</button></div><div class="sm mut">يتطلب النظام كتابة مبرر لأي مهمة لا ترتبط بالاستراتيجية المختارة، لمنع الإسناد العشوائي.</div></div>';
  return h;}
function taskCard(tid,openA,doneA,addedT){var a=S.L.action[tid];if(!a)return '';var key='tc_'+tid,open=S.openCards[key];var st=S.L.steps[tid]||[];
  var h='<div class="card" style="margin:0"><div class="row"><b class="grow">'+esc(a.TaskName)+'</b><span class="tag '+(a.Priority==='أساسي'?'':'gray')+'">'+esc(a.Priority)+'</span></div>'+
  '<div class="sm">'+esc(a.Purpose)+'</div><div class="eg sm">'+esc(a.SummaryEg)+'</div>'+
  '<div class="sm"><b>الوقت:</b> '+esc(a.EstimatedTime)+' | <b>التكرار:</b> '+esc(a.FrequencyText)+'</div><div class="sm"><b>المخرج:</b> '+esc(a.Deliverable)+'</div><div class="sm"><b>الموارد/المتطلبات:</b> '+esc(a.Prerequisites)+'</div><div class="sm mut"><b>متى تختارها:</b> '+esc(a.SelectionConditions)+'</div>';
  if(open)h+='<ol class="steps sm">'+st.map(function(s){return '<li><b>'+esc(s.StepTitle)+':</b> '+esc(s.Instruction)+'<div class="mut">✓ '+esc(s.CheckQuestion)+'</div></li>'}).join('')+'</ol><div class="sm"><b>الدليل:</b> '+esc(a.Evidence)+'</div><div class="sm"><b>بديل منخفض الموارد:</b> '+esc(a.LowResourceAlternative)+'</div><div class="sm mut">⚠ '+esc(a.Cautions)+'</div>';
  h+='<div class="row" style="margin-top:6px"><button class="btn sm ghost" data-act="toggle" data-v="'+key+'">'+(open?'إخفاء التعليمات':'عرض التعليمات ('+st.length+' خطوات)')+'</button><span class="grow"></span>'+
    (openA?'<span class="tag warn">مسندة ومفتوحة ('+esc(openA.AssignmentID)+')</span>':addedT?'<span class="tag ok">✓ مضافة</span>':'<button class="btn sm" data-act="addTask" data-v="'+tid+'">+ إضافة للخطة</button>')+(doneA?'<span class="tag gray">أُنجزت سابقًا</span>':'')+'</div></div>';return h;}

/* ---- step 7: routines */
function routineFinal(r){var rr=S.d.routineReviews[r.RAID]||{};var dc=rr.Decision;if(dc==='إنهاء')return 'منتهي';if(dc==='إيقاف مؤقت')return 'متوقف مؤقتًا';if(dc==='إعادة تفعيل')return 'نشط';return r.Status;}
function st7(){var d=S.d,L=S.L,c=S.ctx,cs=chosenStrats();var active={};c.routines.forEach(function(r){var f=routineFinal(r);if(f!=='منتهي')active[r.RoutineID]=f});var added={};d.newRoutines.forEach(function(r){added[r.RoutineID]=1});
  var h='<div class="card"><h3>7. الروتينات</h3><div class="sm mut">الروتين يُسند مرة واحدة ويستمر بين الجلسات، ويُسجل تنفيذه مرة بمرة. اختر فقط ما يناسب المشروع.</div>';
  ['روتين أساسي','روتين مرتبط بالاستراتيجية'].forEach(function(tp){var rs=c.routines.filter(function(r){return r.RoutineType===tp});h+='<h4>'+(tp==='روتين أساسي'?'روتينات أساسية مستمرة':'روتينات مرتبطة باستراتيجية')+' ('+rs.length+')</h4>';
    h+=rs.length?rs.map(function(r){var f=routineFinal(r);var warn=tp!=='روتين أساسي'&&r.StrategyID&&cs.indexOf(r.StrategyID)<0&&f==='نشط';return '<div class="row sm" style="padding:4px 0;border-bottom:1px dashed var(--line)"><span class="grow">'+esc(r.RoutineName)+' <span class="mut">('+esc(r.FrequencyText)+')</span></span><span class="tag '+(f==='نشط'?'ok':'gray')+'">'+esc(f)+'</span>'+(warn?'<span class="tag warn">الاستراتيجية تغيرت — راجع قرار هذا الروتين في الخطوة 2</span>':'')+'</div>'}).join(''):'<div class="sm mut">لا يوجد.</div>';});
  if(d.newRoutines.length)h+='<h4>روتينات جديدة ستُضاف</h4>'+d.newRoutines.map(function(r,i){var lr=L.routine[r.RoutineID];var P='newRoutines|'+i+'|';return '<div class="card flat" style="padding:8px 10px"><div class="row"><b class="grow">'+esc(lr.RoutineName)+'</b><span class="tag acc">'+esc(lr.RoutineType)+'</span><button class="btn sm danger" data-act="delRoutine" data-i="'+i+'">إزالة</button></div><div class="grid g3"><div><label class="f">تاريخ البدء</label>'+inp(P+'StartDate','date')+'</div><div><label class="f">المسؤول</label>'+inp(P+'Responsible','text',lr.Responsible)+'</div><div><label class="f">تخصيص</label>'+inp(P+'CustomNote')+'</div></div></div>'}).join('');
  h+='</div>';
  var rec=[];cs.forEach(function(sid){ids(L.strategy[sid].RoutineIDs).forEach(function(r){if(rec.indexOf(r)<0)rec.push(r)})});
  var areaOf=d.diagnosis.ProblemID?L.problem[d.diagnosis.ProblemID].AreaID:'';
  var core=L.LIB_Routines.filter(function(r){return r.RoutineType==='روتين أساسي'&&r.AreaID===areaOf&&rec.indexOf(r.RoutineID)<0}).map(function(r){return r.RoutineID});
  var show=function(list,title){var items=list.filter(function(x){return !active[x]&&!added[x]});if(!items.length)return '';return '<h4>'+title+'</h4><div class="grid g2">'+items.map(routineLibCard).join('')+'</div>';};
  h+=show(rec,'روتينات مقترحة للاستراتيجية المختارة')+show(core,'روتينات أساسية في نفس المجال');
  var key='allR';h+='<div class="acc '+(S.openCards[key]?'open':'')+'"><div class="hd" data-act="toggle" data-v="'+key+'"><span class="caret">◀</span><b>كل مكتبة الروتينات ('+L.LIB_Routines.length+')</b></div>'+(S.openCards[key]?'<div class="bd">'+L.LIB_Areas.map(function(a){var items=L.LIB_Routines.filter(function(r){return r.AreaID===a.AreaID&&!active[r.RoutineID]&&!added[r.RoutineID]});return '<h4>'+esc(a.AreaName)+'</h4><div class="grid g2">'+items.map(function(r){return routineLibCard(r.RoutineID)}).join('')+'</div>'}).join('')+'</div>':'')+'</div>';
  return h;}
function routineLibCard(rid){var r=S.L.routine[rid];if(!r)return '';var key='rl_'+rid,open=S.openCards[key];return '<div class="card" style="margin:0"><div class="row"><b class="grow">'+esc(r.RoutineName)+'</b><span class="tag acc">'+esc(r.RoutineType)+'</span><span class="tag gray">'+esc(r.FrequencyText)+'</span></div><div class="sm">'+esc(r.Purpose)+'</div><div class="eg sm">'+esc(r.SummaryEg)+'</div><div class="sm mut">الملاءمة: '+esc(r.Applicability)+'</div>'+
  (open?'<ol class="steps sm">'+(S.L.rsteps[rid]||[]).map(function(s){return '<li><b>'+esc(s.StepTitle)+':</b> '+esc(s.Instruction)+'</li>'}).join('')+'</ol><div class="sm"><b>بديل ورقي:</b> '+esc(r.PaperAlternative)+'</div>':'')+
  '<div class="row"><button class="btn sm ghost" data-act="toggle" data-v="'+key+'">'+(open?'إخفاء':'الخطوات')+'</button><span class="grow"></span><button class="btn sm" data-act="addRoutine" data-v="'+rid+'">+ إضافة</button></div></div>';}

/* ---- step 8: workload */
function minutes(t){t=String(t||'');var m=t.match(/(\d+(?:\.\d+)?)/);if(!m)return 0;var n=+m[1];if(/ساع/.test(t))return n*60;if(/أسبوع/.test(t))return n*240;if(/يوم/.test(t))return n*120;return n;}
function workload(){var d=S.d,L=S.L,c=S.ctx;var cont=c.openAssignments.filter(function(a){var r=d.reviews[a.AssignmentID];return ['تم الإنجاز','إلغاء لعدم الملاءمة','تقسيم لمهام أصغر','إيقاف مؤقت'].indexOf(r.Decision)<0});
  var subs=0;c.openAssignments.forEach(function(a){var r=d.reviews[a.AssignmentID];if(r.Decision==='تقسيم لمهام أصغر')subs+=(r.SubTasks||[]).filter(function(x){return x.name}).length});
  var rs=c.routines.filter(function(r){return routineFinal(r)==='نشط'}).map(function(r){return r.FrequencyCode}).concat(d.newRoutines.map(function(r){return (L.routine[r.RoutineID]||{}).FrequencyCode}));
  var cnt=function(k){return rs.filter(function(x){return x===k}).length};var mins=d.newTasks.reduce(function(s,t){return s+minutes((L.action[t.TaskID]||{}).EstimatedTime)},0);
  return {newT:d.newTasks.length+subs,cont:cont.length,daily:cnt('DAILY'),weekly:cnt('WEEKLY'),monthly:cnt('MONTHLY'),periodic:cnt('PERIODIC'),hours:Math.round(mins/60*10)/10};}
function st8(){var d=S.d,w=workload(),L=S.L;var h='<div class="card"><h3>8. تقييم حجم العمل</h3><div class="tiles">'+tile(w.newT,'مهام جديدة')+tile(w.cont,'مهام سابقة مستمرة')+tile(w.daily,'روتين يومي')+tile(w.weekly,'روتين أسبوعي')+tile(w.monthly+w.periodic,'شهري/دوري')+tile(w.hours,'ساعات تقديرية للمهام الجديدة')+'</div></div>';
  h+='<div class="card"><div class="b" style="font-size:16px">اسأل صاحب المشروع:</div><div class="box info" style="font-size:16px">«على مقياس من 1 إلى 5، شايف إنك قادر تنفذ المهام دي خلال الأسبوع؟»</div><div>'+[1,2,3,4,5].map(function(n){return '<span class="chip '+(n<=2?'bad':n>=4?'ok':'warn')+(String(d.readiness)===String(n)?' on':'')+'" data-act="readiness" data-v="'+n+'" style="font-size:16px;padding:6px 16px">'+n+'</span>'}).join('')+'</div>';
  if(d.readiness&&+d.readiness<=2){var opt=d.newTasks.filter(function(t){return (L.action[t.TaskID]||{}).Priority!=='أساسي'});h+='<div class="box bad"><b>الاستعداد منخفض.</b> اقتراحات: قلّل المهام الجديدة إلى مهمة واحدة أساسية، بسّط المهام المستمرة، أو أجّل الروتينات الأقل أهمية.'+(opt.length?'<br>مهام غير أساسية يمكن تأجيلها: '+opt.map(function(t){return esc((L.action[t.TaskID]||{}).TaskName||t.TaskName)}).join('، '):'')+'</div><label class="f req">ماذا قررتما؟ (مطلوب إذا بقيت أكثر من مهمة جديدة)</label>'+ta('workloadNote');}
  else if(d.readiness)h+='<label class="f">ملاحظة (اختياري)</label>'+ta('workloadNote');
  return h+'</div>';}

/* ---- step 9: final review */
function st9(){var d=S.d,L=S.L,c=S.ctx;var h='<div class="card"><h3>9. المراجعة النهائية للخطة</h3><div class="kv"><b>المشكلة:</b> '+esc((L.problem[d.diagnosis.ProblemID]||{}).ProblemName||'—')+' | <b>الاستراتيجية:</b> '+esc((L.strategy[d.strategy.PrimaryStrategyID]||{}).StrategyName||'—')+(d.strategy.SupportingStrategyID?' + '+esc(L.strategy[d.strategy.SupportingStrategyID].StrategyName):'')+'</div></div>';
  h+='<div class="card"><h4>1) مهام التحسين الجديدة ('+d.newTasks.length+')</h4>'+(d.newTasks.length?'<table class="t"><tr><th>المهمة</th><th>الموعد</th><th>المسؤول</th><th>التخصيص</th></tr>'+d.newTasks.map(function(t,i){return '<tr><td>'+esc(t.TaskID==='CUSTOM'?t.TaskName:(L.action[t.TaskID]||{}).TaskName)+'</td><td style="width:150px">'+inp('newTasks|'+i+'|Deadline','date')+'</td><td>'+esc(t.Responsible||'')+'</td><td class="sm">'+esc(t.CustomInstructions||'')+'</td></tr>'}).join('')+'</table>':'<div class="mut sm">لا توجد.</div>');
  var subs=[];c.openAssignments.forEach(function(a){var r=d.reviews[a.AssignmentID];if(r.Decision==='تقسيم لمهام أصغر')(r.SubTasks||[]).forEach(function(s){if(s.name)subs.push(s.name+' ← '+(s.deadline||''))})});if(subs.length)h+='<div class="sm"><b>مهام أصغر من تقسيم مهام سابقة:</b> '+subs.map(esc).join(' | ')+'</div>';
  h+='</div><div class="card"><h4>2) مهام سابقة مستمرة بقرار المنتور</h4>'+c.openAssignments.map(function(a){var r=d.reviews[a.AssignmentID];if(['تم الإنجاز','إلغاء لعدم الملاءمة','تقسيم لمهام أصغر'].indexOf(r.Decision)>=0)return '';return '<div class="row sm" style="border-bottom:1px dashed var(--line);padding:4px 0"><span class="grow">'+esc(a.TaskName)+'</span>'+statusTag(r.Status)+decTag(r.Decision)+'<span>'+esc(r.NewDeadline||'')+'</span><span class="mut">'+esc(r.Adjustment||'')+'</span></div>'}).join('')+'</div>';
  var act=c.routines.filter(function(r){return routineFinal(r)==='نشط'});h+='<div class="card"><h4>3–4) الروتينات المستمرة والجديدة</h4>'+act.map(function(r){return '<span class="tag '+(r.RoutineType==='روتين أساسي'?'':'acc')+'">'+esc(r.RoutineName)+'</span>'}).join('')+d.newRoutines.map(function(r){return '<span class="tag ok">+ '+esc(L.routine[r.RoutineID].RoutineName)+'</span>'}).join('')+'</div>';
  h+='<div class="card"><div class="grid g2"><div><label class="f req">موعد الجلسة القادمة</label>'+inp('planEnd','date')+'</div><div><label class="f">رسالة المنتور لصاحب المشروع (تظهر في الخطة)</label>'+ta('mentorSummary','','style="min-height:44px"')+'</div></div></div>';return h;}

/* ---- step 10: validate & save */
function clientChecks(){var d=S.d,c=S.ctx,e=[];var pr=reviewProgress();if(pr.done<pr.total)e.push('أكمل مراجعة كل المهام السابقة ('+pr.done+'/'+pr.total+')');if(pr.rdone<pr.rtotal)e.push('أكمل مراجعة الروتينات ('+pr.rdone+'/'+pr.rtotal+')');
  if(!d.diagnosis.ProblemID)e.push('اختر المشكلة ذات الأولوية');if(!d.strategy.PrimaryStrategyID)e.push('اختر الاستراتيجية الأساسية');if(!d.readiness)e.push('سجّل درجة الاستعداد');
  if(!c.isFirstSession&&!d.businessResultNote)e.push('اكتب النتيجة الفعلية للأعمال (الخطوة 3)');d.newTasks.forEach(function(t){if(!t.Deadline)e.push('حدد موعد كل مهمة جديدة')});return e;}
function st10(){var e=clientChecks();return '<div class="card"><h3>10. حفظ الجلسة وتوليد الخطة</h3>'+(e.length?'<div class="box warn"><b>قبل الحفظ:</b><ul>'+e.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div>':'<div class="box ok">كل البيانات الأساسية مكتملة.</div>')+
  '<div class="sm mut">عند الحفظ: تُسجل المراجعات كسجلات جديدة دون تعديل الجلسات السابقة، وتُنشأ التكليفات الجديدة بنسخة من التعليمات وقت الإسناد، وتبقى الروتينات تكليفًا واحدًا مستمرًا.</div>'+
  '<div class="row" style="margin-top:10px"><button class="btn" data-act="finalize" '+(e.length?'disabled':'')+'>💾 حفظ الجلسة وتوليد الخطة الأسبوعية</button><button class="btn danger sm" data-act="discard">حذف المسودة</button></div></div>';}

/* ============================================================ dashboard */

  '<div><label class="f">المشروع</label><select data-act="df" data-k="projectId"><option value="">الكل</option>'+ps.map(function(p){return '<option value="'+p.ProjectID+'"'+(f.projectId===p.ProjectID?' selected':'')+'>'+esc(p.ProjectName)+'</option>'}).join('')+'</select></div>'+
  '<div><label class="f">الدورة</label><select data-act="df" data-k="round"><option value="">الكل</option>'+D.rounds.filter(Boolean).map(function(r){return '<option'+(f.round===r?' selected':'')+'>'+esc(r)+'</option>'}).join('')+'</select></div>'+

  '<div style="align-self:end"><button class="btn" data-act="applyDash">تطبيق</button> <button class="btn sec" data-act="resetDash">مسح</button></div></div><div class="sm mut">المنتور يُختار من الشريط العلوي. البيانات التجريبية '+(S.includeTest?'مضمّنة':'مستبعدة')+'.</div></div>';

  h+='<div class="grid g3" style="margin-top:10px">'+barCard('أكثر عوائق التنفيذ',D.barriers)+barCard('أكثر المشكلات اختيارًا',D.topProblems)+barCard('أكثر الاستراتيجيات اختيارًا',D.topStrategies)+'</div>';
  h+='<h4>تغير أداء المشروعات (منفصل عن جودة المنتورينج)</h4>'+(D.performance.length?'<div class="tbl"><table class="t"><tr><th>المشروع</th><th>المؤشر</th><th>أول قياس</th><th>آخر قياس</th><th>الاتجاه</th><th>التغير</th><th>التقييم</th></tr>'+D.performance.map(function(p){return '<tr><td>'+esc(p.ProjectName)+'</td><td>'+esc(p.KPIName)+' <span class="mut sm">('+esc(p.Unit)+')</span></td><td>'+fmtN(p.first)+' <span class="sm mut">'+esc(p.firstDate)+'</span></td><td>'+fmtN(p.last)+' <span class="sm mut">'+esc(p.lastDate)+'</span></td><td>'+spark(p.series)+'</td><td>'+(p.change===null?'—':(p.change>0?'+':'')+fmtN(p.change)+(p.changePct!==null?' ('+p.changePct+'%)':''))+'</td><td>'+(p.improved===true?'<span class="tag ok">تحسن</span>':p.improved===false?'<span class="tag bad">تراجع</span>':'<span class="tag gray">—</span>')+'</td></tr>'}).join('')+'</table></div>':'<div class="card mut">لا توجد قيم مؤشرات في هذا النطاق.</div>');

  h+='<div class="card sm"><b>التعريفات:</b><br>معدل إنجاز المهام = المهام المكتملة المستحقة خلال الفترة ÷ إجمالي المهام المنطبقة المستحقة خلال الفترة (تُستبعد الملغاة لعدم الملاءمة والموقوفة مؤقتًا).<br>الالتزام بالروتين = مرات الروتين المنفذة ÷ المرات المخططة المستحقة (تُستبعد أيام الإجازة).<br>تغطية الأدلة = المهام المكتملة المدعومة بدليل ÷ إجمالي المهام المكتملة.<br>قياس النتائج = المهام التي سُجلت لها نتيجة ÷ المهام المستحقة لتقييم النتيجة (المكتملة والجزئية).<br>هذه المؤشرات تقيس جودة عملية المنتورينج ولا تُستخدم كبديل عن تغير مؤشرات أداء المشروع.</div>';
  return h;}
function rateTile(v,l,sub){var c=v===null?'':v>=70?'ok':v>=40?'warn':'bad';return '<div class="tile '+c+'"><div class="n">'+pct(v)+'</div><div class="l">'+esc(l)+'</div><div class="bar" style="margin-top:4px"><i style="width:'+(v||0)+'%"></i></div><div class="sm mut">'+esc(sub)+'</div></div>';}
function barCard(t,arr){var mx=Math.max.apply(null,[1].concat(arr.map(function(x){return x.count})));return '<div class="card" style="margin:0"><h4 style="margin-top:0">'+esc(t)+'</h4>'+(arr.length?arr.slice(0,8).map(function(x){return '<div class="sm">'+esc(x.name)+' <b>('+x.count+')</b></div><div class="bar" style="margin-bottom:5px"><i style="width:'+(x.count/mx*100)+'%"></i></div>'}).join(''):'<div class="sm mut">لا توجد بيانات.</div>')+'</div>';}

document.addEventListener('input',function(e){var b=e.target.getAttribute('data-bind');if(b&&S.d){var v=e.target.value;setP(S.d,b,v);S.dirty=true;
  if(/BeforeValue|AfterValue|kpiValues/.test(b)){clearTimeout(window._rr);window._rr=setTimeout(function(){keepScroll(render)},700);}}
  var a=e.target.getAttribute('data-act');if(a==='searchProjects'){S.q=e.target.value;clearTimeout(window._sq);window._sq=setTimeout(function(){keepScroll(render);var x=document.getElementById('pq');if(x){x.focus();x.setSelectionRange(x.value.length,x.value.length)}},250);}
  if(a==='jsearch'){S.jf.q=e.target.value;clearTimeout(window._jq);window._jq=setTimeout(function(){keepScroll(render);var x=document.getElementById('jq');if(x){x.focus();x.setSelectionRange(x.value.length,x.value.length)}},300);}});
document.addEventListener('change',function(e){var t=e.target,a=t.getAttribute('data-act'),b=t.getAttribute('data-bind');
  if(b&&S.d){setP(S.d,b,t.value);S.dirty=true;if(t.tagName==='SELECT'||/Deadline|Date|planEnd/.test(b))keepScroll(render);}
  if(a==='mentor'){S.mentorId=t.value;if(S.view==='dashboard')loadDash();else if(S.view==='projects')render();}
  if(a==='toggleTest'){S.includeTest=t.checked;if(S.view==='dashboard')loadDash();else loadProjects();}
  if(a==='jf'){S.jf[t.getAttribute('data-k')]=t.value;var all=t.value?1:0;if(all)S.journey.sessions.forEach(function(s){S.openCards['ses_'+s.SessionID]=1});render();}
  if(a==='df'||a==='dfi'){S.df[t.getAttribute('data-k')]=t.value;if(a==='df')loadDash();}});

  applyDash:loadDash,resetDash:function(){S.df={};loadDash()}};
  if(H[a]){e.preventDefault();H[a]();}});
function payload(){var d=S.d,c=S.ctx;return {sessionDate:d.sessionDate,planEnd:d.planEnd,businessResultNote:d.businessResultNote,readiness:d.readiness,workloadNote:d.workloadNote,mentorSummary:d.mentorSummary,
  reviews:c.openAssignments.map(function(a){var r=JSON.parse(JSON.stringify(d.reviews[a.AssignmentID]));r.AssignmentID=a.AssignmentID;return r}),
  routineReviews:c.routines.map(function(r){var rr=d.routineReviews[r.RAID];return {RAID:r.RAID,Decision:rr.Decision,Note:rr.Note,EvidenceLink:rr.EvidenceLink,NewNote:rr.NewNote,Responsible:rr.Responsible,
    occurrences:r.slots.map(function(s){return {DueDate:s.DueDate,PeriodLabel:s.PeriodLabel,Status:rr.occ[s.DueDate+'#'+s.PeriodLabel]}})}}),
  kpiValues:Object.keys(d.kpiValues).filter(function(k){return d.kpiValues[k].Value!==''&&d.kpiValues[k].Value!==undefined}).map(function(k){return {KPIID:k,Value:d.kpiValues[k].Value,Source:d.kpiValues[k].Source}}),
  newProjectKPIs:Object.keys(d.newProjectKPIs).map(function(k){return {KPIID:k,TargetValue:d.newProjectKPIs[k].TargetValue}}),
  diagnosis:{ProblemID:d.diagnosis.ProblemID,ContinuedFocus:d.diagnosis.ContinuedFocus,causes:Object.keys(d.diagnosis.causes).map(function(k){return {CauseID:k,Classification:d.diagnosis.causes[k].Classification,EvidenceNote:d.diagnosis.causes[k].EvidenceNote}})},
  strategy:d.strategy,newTasks:d.newTasks,newRoutines:d.newRoutines};}
function finalize(){var sid=S.ctx.session.SessionID,pid=S.ctx.project.ProjectID;run(call('finalize',sid,payload()),'حفظ الجلسة…').then(function(){S.dirty=false;toast('تم حفظ الجلسة');return call('journey',pid)}).then(function(j){S.journey=j;S.ctx=null;S.d=null;openPlan(sid);});}
init();
</script>
